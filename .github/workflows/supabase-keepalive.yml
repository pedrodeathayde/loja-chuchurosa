name: Supabase Keep-Alive
on:
  schedule:
    - cron: '0 9 * * *'  # todo dia, 9h UTC — mais margem
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase (insert)
        run: |
          curl -sf -X POST "https://oznpfqsgurztffwfyfec.supabase.co/rest/v1/keep_alive_ping" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{}'
