<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Loja — Chuchu Rosa</title>
<meta name="description" content="Fantasias artesanais, brinquedos educativos e decoração infantil. Flamingos, raposas, unicórnios e muito mais.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;0,900;1,500;1,700&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<style>
:root{
  --pink:#e52564;--pink2:#f04d7f;--rose:#c41d55;
  --dark:#0c090d;--dark2:#1a0e1c;
  --cream:#fdf8f5;--cream2:#f5ede8;--white:#fff;
  --gold:#c9a96e;
  --fd:'Playfair Display',Georgia,serif;
  --fb:'DM Sans',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{overflow-x:hidden;max-width:100%}
html{scroll-behavior:smooth}
body{background:var(--cream);color:var(--dark);font-family:var(--fb)}
a{text-decoration:none;color:inherit}
img{display:block;max-width:100%;height:auto}
::-webkit-scrollbar{width:3px}
::-webkit-scrollbar-thumb{background:var(--pink);border-radius:2px}

/* ── NAV ── */
nav{
  position:sticky;top:0;z-index:200;
  background:rgba(12,9,13,.95);
  backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  border-bottom:1px solid rgba(229,37,100,.12);
  height:64px;padding:0 28px;
  display:flex;align-items:center;gap:12px;
  width:100%;
  transition:border-color .3s,box-shadow .3s;
}
nav.elevated{
  border-color:rgba(229,37,100,.2);
  box-shadow:0 4px 24px rgba(0,0,0,.2);
}
.nav-logo{flex-shrink:0;display:flex;align-items:center}
.nav-logo canvas{height:34px;width:auto}
.nav-search{
  flex:1;position:relative;
  min-width:0;
}
.nav-search input{
  width:100%;padding:9px 16px 9px 40px;
  border:1.5px solid rgba(244,121,154,.18);border-radius:100px;
  font-family:var(--fb);font-size:.84rem;
  background:rgba(255,255,255,.07);color:#fff;
  outline:none;transition:all .25s;
}
.nav-search input:focus{border-color:var(--pink);background:rgba(255,255,255,.1);box-shadow:0 0 0 3px rgba(229,37,100,.12)}
.nav-search input::placeholder{color:rgba(255,255,255,.3)}
.nav-search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--pink2)}
.nav-cart{
  flex-shrink:0;
  background:var(--pink);color:#fff;border:none;
  border-radius:100px;padding:7px 14px;
  font-family:var(--fb);font-size:.8rem;font-weight:600;
  cursor:pointer;display:flex;align-items:center;gap:6px;
  white-space:nowrap;transition:background .2s;
}
.nav-cart:hover{background:var(--rose)}
.cart-count{
  background:#fff;color:var(--rose);
  border-radius:100px;font-size:.68rem;font-weight:700;
  padding:1px 6px;min-width:16px;text-align:center;
}
.hamburger{
  display:none;flex-direction:column;gap:4px;
  cursor:pointer;padding:6px;border:none;background:transparent;flex-shrink:0;
}
.hamburger span{display:block;width:18px;height:2px;background:var(--pink2);border-radius:2px;transition:all .3s}

/* ── HERO ── */
.shop-hero{
  position:relative;overflow:hidden;color:#fff;
  min-height:380px;display:flex;align-items:flex-end;
}
@media(max-width:768px){.shop-hero{min-height:280px}}
.hero-slides{position:absolute;inset:0;z-index:0}
.hero-slide{position:absolute;inset:0;opacity:0;transition:opacity 1s ease-in-out;will-change:opacity}
.hero-slide.active{opacity:1}
.hero-slide img{width:100%;height:100%;object-fit:cover;object-position:center 20%;transform:scale(1.05);transition:transform 6s ease-out}
.hero-slide.active img{transform:scale(1)}
.hero-overlay{
  position:absolute;inset:0;z-index:1;
  background:
    linear-gradient(to top,rgba(12,9,13,.92) 0%,rgba(12,9,13,.55) 35%,rgba(12,9,13,.15) 75%,transparent 100%),
    linear-gradient(to right,rgba(12,9,13,.5) 0%,rgba(12,9,13,.1) 55%,transparent 100%);
}
.hero-scan{position:absolute;bottom:0;left:0;right:0;height:2px;z-index:3;background:linear-gradient(90deg,transparent,var(--pink),var(--gold),var(--pink),transparent);opacity:.6}
.hero-dots{position:absolute;bottom:16px;right:20px;z-index:4;display:flex;gap:6px;align-items:center}
.hero-dot{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.35);cursor:pointer;transition:all .3s;border:none;padding:0}
.hero-dot.active{background:#fff;transform:scale(1.3)}
.hero-inner{position:relative;z-index:2;padding:28px 28px 32px;width:100%}
.hero-eyebrow{
  font-size:.6rem;font-weight:700;letter-spacing:.22em;text-transform:uppercase;
  color:var(--gold);display:flex;align-items:center;gap:10px;margin-bottom:14px;
}
.hero-eyebrow::before{content:'';width:24px;height:1px;background:var(--gold);display:block}

.hero-count{
  font-size:.82rem;color:rgba(255,255,255,.65);
  margin-bottom:18px;position:relative;z-index:1;
}
.hero-count b{color:#fff;font-weight:700}
.hero-badges{
  display:flex;flex-wrap:wrap;gap:6px;
  position:relative;z-index:1;
}
.hbadge{
  padding:5px 13px;border-radius:100px;
  border:1px solid rgba(255,255,255,.15);
  font-size:.72rem;font-weight:500;
  color:rgba(255,255,255,.6);
  cursor:pointer;transition:all .2s;
  background:rgba(255,255,255,.04);
  white-space:nowrap;
}
.hbadge:hover,.hbadge.active{
  background:var(--pink);border-color:var(--pink);
  color:#fff;
}

/* ── LAYOUT ── */
.shop-wrap{display:flex;align-items:start;min-height:70vh}

/* ── SIDEBAR ── */
.sidebar{
  width:220px;flex-shrink:0;
  background:var(--white);
  border-right:1px solid rgba(229,37,100,.08);
  padding:20px 16px;
  position:sticky;top:60px;
  height:calc(100vh - 60px);
  overflow-y:auto;
}
.sidebar::-webkit-scrollbar{width:2px}
.sidebar::-webkit-scrollbar-thumb{background:rgba(229,37,100,.2)}
.sidebar-label{
  font-size:.6rem;font-weight:700;letter-spacing:.18em;
  text-transform:uppercase;color:rgba(12,9,13,.4);
  margin-bottom:10px;margin-top:22px;padding-bottom:7px;
  border-bottom:1px solid rgba(229,37,100,.1);
}
.sidebar-label:first-child{margin-top:0}
.cat-list{list-style:none;display:flex;flex-direction:column;gap:1px}
.cat-item{
  display:flex;align-items:center;gap:8px;
  padding:8px 10px;border-radius:10px;
  cursor:pointer;transition:all .15s;
  font-size:.82rem;color:rgba(12,9,13,.6);font-weight:400;
}
.cat-item:hover{background:rgba(229,37,100,.06);color:var(--dark)}
.cat-item.active{background:rgba(229,37,100,.1);color:var(--rose);font-weight:600}
.cat-icon{font-size:.85rem;width:18px;flex-shrink:0}
.sort-select,.price-input{
  width:100%;padding:7px 10px;
  border:1.5px solid rgba(229,37,100,.15);border-radius:8px;
  font-family:var(--fb);font-size:.8rem;
  background:var(--cream);color:var(--dark);
  outline:none;margin-top:8px;cursor:pointer;
}
.price-row{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
.price-input{margin-top:0}

/* ── MAIN ── */
.shop-main{flex:1;min-width:0;padding:16px}

/* ── TOPBAR ── */
.topbar{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:14px;
  padding-bottom:12px;
  border-bottom:1px solid rgba(229,37,100,.08);
}
.topbar-count{font-size:.8rem;color:rgba(12,9,13,.55);font-weight:500}
.topbar-count b{color:var(--dark);font-weight:700}
.view-btns{display:flex;gap:4px}
.vbtn{
  width:30px;height:30px;border-radius:7px;
  border:1.5px solid rgba(229,37,100,.15);
  background:transparent;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  font-size:.8rem;color:rgba(12,9,13,.3);transition:all .15s;
}
.vbtn.active{background:var(--pink);border-color:var(--pink);color:#fff}

/* ── CAT TABS mobile ── */
.cat-tabs{
  display:none;gap:6px;overflow-x:auto;
  padding-bottom:4px;margin-bottom:12px;
  scrollbar-width:none;
}
.cat-tabs::-webkit-scrollbar{display:none}
.cat-tab{
  padding:6px 16px;border-radius:100px;
  font-family:var(--fb);font-size:.72rem;font-weight:600;letter-spacing:.03em;
  cursor:pointer;white-space:nowrap;flex-shrink:0;
  background:var(--white);color:rgba(12,9,13,.55);
  border:1.5px solid rgba(12,9,13,.1);transition:all .2s;
}
.cat-tab.active{background:var(--pink);color:#fff;border-color:var(--pink);box-shadow:0 4px 14px rgba(229,37,100,.25)}

/* ── PRODUCT GRID ── */
.prod-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}
@media(min-width:640px){
  .prod-grid{grid-template-columns:repeat(3,1fr);gap:14px}
}
@media(min-width:1100px){
  .prod-grid{grid-template-columns:repeat(4,1fr);gap:16px}
}
.prod-grid.list-view{grid-template-columns:1fr}

/* ── PRODUCT CARD ── */
.pcard{
  background:var(--white);
  border-radius:16px;overflow:hidden;
  border:1px solid rgba(229,37,100,.07);
  cursor:pointer;
  transition:transform .3s cubic-bezier(.25,.46,.45,.94),box-shadow .3s,border-color .3s;
  position:relative;
}
.pcard:hover{
  transform:translateY(-6px);
  box-shadow:0 20px 48px rgba(229,37,100,.13);
  border-color:rgba(229,37,100,.25);
}
.pcard-img{
  aspect-ratio:1;overflow:hidden;
  background:var(--cream2);position:relative;
}
.pcard-img img{
  width:100%;height:100%;object-fit:cover;
  position:absolute;inset:0;
  transition:transform .4s;
}
.pcard:hover .pcard-img img{transform:scale(1.07)}
.pcard-ph{
  position:absolute;inset:0;
  display:flex;align-items:center;justify-content:center;
  font-size:2rem;
  background:linear-gradient(135deg,var(--cream),var(--cream2));
}
.pcard-badge{
  position:absolute;top:8px;left:8px;
  background:var(--dark);color:#fff;
  font-size:.58rem;font-weight:700;letter-spacing:.06em;
  text-transform:uppercase;padding:2px 8px;border-radius:100px;
}
.pcard-body{padding:10px 12px 12px}
.pcard-cat{
  font-size:.58rem;font-weight:700;letter-spacing:.14em;
  text-transform:uppercase;color:var(--pink);margin-bottom:5px;
}
.pcard-name{
  font-family:var(--fd);font-size:.9rem;font-weight:700;
  color:var(--dark);line-height:1.2;margin-bottom:6px;
}
.pcard-prazo{
  font-size:.64rem;color:rgba(12,9,13,.5);margin-bottom:10px;
}
.pcard-footer{
  display:flex;align-items:center;
  justify-content:space-between;gap:8px;flex-wrap:nowrap;
}
.pcard-price{
  font-size:.9rem;font-weight:700;color:var(--dark);
  white-space:nowrap;flex-shrink:0;line-height:1.2;
}
.pcard-price.promo{color:var(--rose)}
.pcard-price-old{
  font-size:.65rem;color:rgba(12,9,13,.32);
  text-decoration:line-through;display:block;line-height:1.3;
}
.btn-add{
  flex-shrink:0;
  background:var(--pink);color:#fff;border:none;
  border-radius:100px;padding:7px 14px;
  font-family:var(--fb);font-size:.72rem;font-weight:600;
  cursor:pointer;transition:background .2s;white-space:nowrap;
  display:flex;align-items:center;gap:5px;
}
.btn-add:hover{background:var(--rose)}
.btn-consult{
  flex-shrink:0;
  background:rgba(229,37,100,.08);color:var(--rose);border:none;
  border-radius:100px;padding:7px 14px;
  font-family:var(--fb);font-size:.72rem;font-weight:600;
  cursor:pointer;white-space:nowrap;
}
.pcard-swatches{display:flex;gap:4px;margin-bottom:6px;flex-wrap:wrap}
.swatch{
  width:12px;height:12px;border-radius:50%;
  border:1.5px solid rgba(12,9,13,.1);flex-shrink:0;
}

/* LIST VIEW */
.prod-grid.list-view .pcard{display:grid;grid-template-columns:120px 1fr}
.prod-grid.list-view .pcard-img{aspect-ratio:1;min-height:120px}
.prod-grid.list-view .pcard-body{padding:14px 16px;display:flex;flex-direction:column;justify-content:center}

/* ── SKELETON ── */
.skel{background:var(--white);border-radius:14px;overflow:hidden;border:1px solid rgba(229,37,100,.05)}
.skel-img{aspect-ratio:1;background:linear-gradient(90deg,#f0e8e4 25%,#f8f0ec 50%,#f0e8e4 75%);background-size:200%;animation:sk 1.4s infinite}
.skel-line{height:10px;border-radius:5px;margin:12px 12px 6px;background:linear-gradient(90deg,#f0e8e4 25%,#f8f0ec 50%,#f0e8e4 75%);background-size:200%;animation:sk 1.4s infinite}
.skel-line.sm{width:55%;height:8px;margin-top:0}
@keyframes sk{0%{background-position:200% 0}100%{background-position:-200% 0}}

/* ── FEATURED STRIP ── */
.featured-strip{
  background:var(--white);
  border-bottom:1px solid rgba(229,37,100,.07);
  padding:20px;
}
.strip-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.strip-ttl{
  font-family:var(--fd);font-size:.95rem;font-weight:700;
  display:flex;align-items:center;gap:8px;
}
.strip-ttl::before{content:'';width:3px;height:1em;background:var(--pink);border-radius:2px;display:block}
.strip-link{font-size:.74rem;color:var(--pink);font-weight:600;cursor:pointer;background:none;border:none}
.strip-scroll{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.strip-scroll::-webkit-scrollbar{display:none}
.scard{
  flex:0 0 140px;background:var(--cream);
  border-radius:12px;overflow:hidden;
  border:1px solid rgba(229,37,100,.07);
  cursor:pointer;transition:all .22s;position:relative;
}
@media(min-width:640px){.scard{flex:0 0 160px}}
.scard:hover{transform:translateY(-3px);box-shadow:0 8px 24px rgba(229,37,100,.1)}
.scard-img{aspect-ratio:1;overflow:hidden;position:relative;background:var(--cream2)}
.scard-img img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0;transition:transform .35s}
.scard:hover .scard-img img{transform:scale(1.05)}
.scard-ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:1.5rem}
.scard-body{padding:8px 10px 10px}
.scard-name{font-family:var(--fd);font-size:.74rem;font-weight:700;line-height:1.25;margin-bottom:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.scard-price{font-size:.8rem;font-weight:700;color:var(--dark)}
.scard-badge{position:absolute;top:6px;left:6px;background:var(--pink);color:#fff;font-size:.55rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:2px 7px;border-radius:100px}

/* ── EMPTY ── */
.empty{text-align:center;padding:60px 20px;color:rgba(12,9,13,.3);grid-column:1/-1}
.empty-icon{font-size:3rem;margin-bottom:12px;opacity:.5}

/* ── PAGINATION ── */
.pagination{display:flex;gap:4px;justify-content:center;padding:32px 0 12px;flex-wrap:wrap}
.pag-btn{
  width:38px;height:38px;border-radius:10px;
  border:1.5px solid rgba(229,37,100,.15);
  background:var(--white);font-family:var(--fb);font-size:.82rem;
  cursor:pointer;transition:all .2s;
  display:flex;align-items:center;justify-content:center;
  color:rgba(12,9,13,.5);font-weight:500;
}
.pag-btn:hover{background:rgba(229,37,100,.06);border-color:rgba(229,37,100,.25);color:var(--rose)}
.pag-btn.active{background:var(--pink);border-color:var(--pink);color:#fff;box-shadow:0 4px 14px rgba(229,37,100,.3)}
.pag-btn:disabled{opacity:.3;cursor:default}

/* ── CART ── */
.cart-overlay{position:fixed;inset:0;background:rgba(12,9,13,.5);z-index:300;opacity:0;pointer-events:none;transition:opacity .3s}
.cart-overlay.open{opacity:1;pointer-events:all}
.cart-drawer{
  position:fixed;top:0;right:0;bottom:0;width:min(380px,100vw);
  background:var(--white);z-index:301;
  transform:translateX(100%);transition:transform .35s cubic-bezier(.25,.46,.45,.94);
  display:flex;flex-direction:column;box-shadow:-8px 0 32px rgba(0,0,0,.08);
}
.cart-drawer.open{transform:translateX(0)}
.cart-head{padding:18px 20px;border-bottom:1px solid rgba(229,37,100,.08);display:flex;align-items:center;justify-content:space-between}
.cart-head h2{font-family:var(--fd);font-size:1rem;font-weight:700}
.cart-close{background:none;border:none;font-size:1.2rem;cursor:pointer;color:rgba(12,9,13,.3);padding:4px;transition:color .15s}
.cart-close:hover{color:var(--dark)}
.cart-items{flex:1;overflow-y:auto;padding:16px 20px}
.cart-item{display:grid;grid-template-columns:60px 1fr auto;gap:10px;align-items:start;padding:12px 0;border-bottom:1px solid rgba(229,37,100,.06)}
.ci-img{width:60px;height:60px;border-radius:10px;overflow:hidden;background:var(--cream);position:relative}
.ci-img img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.ci-name{font-family:var(--fd);font-size:.82rem;font-weight:700;line-height:1.3;margin-bottom:3px}
.ci-prazo{font-size:.65rem;color:rgba(12,9,13,.35);margin-bottom:6px}
.ci-qty{display:flex;align-items:center;gap:6px}
.qty-btn{width:22px;height:22px;border-radius:50%;border:1.5px solid rgba(229,37,100,.2);background:var(--white);font-size:.8rem;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s}
.qty-btn:hover{background:var(--pink);border-color:var(--pink);color:#fff}
.qty-val{font-size:.8rem;font-weight:600;min-width:16px;text-align:center}
.ci-price{font-size:.85rem;font-weight:700}
.ci-remove{background:none;border:none;font-size:.85rem;cursor:pointer;color:rgba(12,9,13,.2);transition:color .15s}
.ci-remove:hover{color:var(--rose)}
.cart-empty{text-align:center;padding:50px 20px;color:rgba(12,9,13,.3)}
.cart-foot{padding:16px 20px;border-top:1px solid rgba(229,37,100,.08)}
.cart-notice{background:rgba(229,37,100,.05);border:1px solid rgba(229,37,100,.1);border-radius:10px;padding:9px 12px;margin-bottom:12px;font-size:.72rem;color:rgba(12,9,13,.5)}
.cart-total-row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px}
.cart-total-val{font-family:var(--fd);font-size:1.3rem;font-weight:900}
.btn-checkout{
  width:100%;background:var(--pink);color:#fff;border:none;
  border-radius:100px;padding:13px;
  font-family:var(--fb);font-size:.9rem;font-weight:700;
  cursor:pointer;transition:background .2s;
  box-shadow:0 4px 16px rgba(229,37,100,.25);
}
.btn-checkout:hover{background:var(--rose)}
.btn-keep{
  width:100%;background:transparent;border:1.5px solid rgba(229,37,100,.2);
  color:var(--rose);border-radius:100px;padding:10px;
  font-family:var(--fb);font-size:.82rem;font-weight:600;
  cursor:pointer;margin-top:7px;transition:background .15s;
}
.btn-keep:hover{background:rgba(229,37,100,.05)}

/* ── TOAST ── */
.toast{
  position:fixed;bottom:24px;left:50%;
  transform:translateX(-50%) translateY(60px);
  background:var(--dark);color:#fff;
  padding:10px 20px;border-radius:100px;
  font-size:.8rem;font-weight:500;z-index:400;
  transition:transform .28s;white-space:nowrap;pointer-events:none;
  box-shadow:0 6px 20px rgba(0,0,0,.18);
}
.toast.show{transform:translateX(-50%) translateY(0)}
.toast span{color:var(--pink2)}

/* ── SIDEBAR OVERLAY ── */
.sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:199}
.sidebar-overlay.open{display:block}

/* ── MOBILE ── */
@media(max-width:768px){
  nav{padding:0 12px;height:56px;gap:8px}
  .hamburger{display:flex}
  .sidebar{
    display:none;position:fixed;top:0;left:0;bottom:0;
    z-index:200;width:260px;background:var(--white);
    transform:translateX(-100%);
    transition:transform .32s cubic-bezier(.25,.46,.45,.94);
    overflow-y:auto;
    box-shadow:4px 0 20px rgba(0,0,0,.08);
  }
  .sidebar.mobile-open{display:block;transform:translateX(0)}
  .shop-wrap{display:block}
  .shop-main{padding:12px}
  .cat-tabs{display:flex}
  .topbar{margin-bottom:10px;padding-bottom:10px}
  .featured-strip{padding:16px}
  .shop-hero{padding:18px 16px 16px}
}
@media(min-width:769px){
  .hamburger{display:none}

function mkLogo(el,h){
  const c=document.createElement('canvas');
  const img=new Image();
  img.onload=()=>{
    const sc=h/img.naturalHeight;
    c.width=Math.round(img.naturalWidth*sc);c.height=h;
    c.style.height=h+'px';c.style.width='auto';
    const ctx=c.getContext('2d');
    ctx.drawImage(img,0,0,c.width,c.height);
    const d=ctx.getImageData(0,0,c.width,c.height);
    for(let i=0;i<d.data.length;i+=4){
      const br=(d.data[i]+d.data[i+1]+d.data[i+2])/3;
      if(br<36)d.data[i+3]=0;
      else if(br<75)d.data[i+3]=Math.round(((br-36)/39)*255);
    }
    ctx.putImageData(d,0,0);
    el.appendChild(c);
  };
  img.src=LOGO_URI;
}

function buildCatalog(){
  const seen=new Map();
  for(const f of FILES){
    const base=f.n.replace(/\.[^.]+$/,'');
    const prefix=base.includes('-')?base.substring(0,base.lastIndexOf('-')):base;
    if(!seen.has(prefix)){
      seen.set(prefix,f);
    } else {
      const cur=seen.get(prefix);
      const fOk=!f.n.includes('(')&&f.n.endsWith('.jpg');
      const cOk=!cur.n.includes('(')&&cur.n.endsWith('.jpg');
      if(fOk&&!cOk) seen.set(prefix,f);
    }
  }
  const prods=[];
  for(const [prefix,f] of seen){
    const name=prefix.replace(/-/g,' ').replace(/\b\w/g,c=>c.toUpperCase());
    prods.push({
      id:prefix,
      name:name,
      collections:guessCategories(prefix),
      url:f.u,
      price:null,
      preco_promocional:null,
      prazo_producao_dias:7,
      destaque:false,
    });
  }
  return prods;
}

function guessCategories(n){
  const cats=[];
  if(n.startsWith('fantasia')||n.startsWith('capa-com')||n.startsWith('saia-de-tul')) cats.push('Fantasias');
  if(n.startsWith('almofada')) cats.push('Almofadas');
  if(/naninha|chocalho|mobile|kit-bebe|kit-berco|protetor-de-berco|porta-maternidade|rede-para|pulseira-chocalho|bola-arco|bola-quebra|piramide|castelo-edu|saco-org|kit-ferr|kit-pique|kit-fundo|lanche-edu|sorvete-edu|tapete-edu|tapete-sens|tapete-mine|torre-de|painel-edu|quebra-cab|cubo-com|cubos-com|bolo-edu|laranja-lar|limao-lim|maca-mont|camera-foto/.test(n)) cats.push('Para bebês');
  if(/flamingo|arara|tucano|passaro|cisne|coruja|beija-flor|gaviao|calopsita|bem-te-vi|^ema-|galinha|papagaio|pavao|pintinho|tuiuiu|corvo|bandeirola-de-flamingo|cabeça-de-flamingo|cabeca-de-flamingo|capa-de-flamingo|chocalho-de-flamingo|naninha-de-flamingo|mobile-flamingo|kit-bebe-flamingo|lembrancinha.*flamingo/.test(n)) cats.push('Pássaros');
  if(/nuvem|bandeirola|arco-iris|dinossauro-de-parede|unicornio-de-parede|balao-deco|vaso-de|porta-treco|prendedor|casal-de-coelh|raposa-boneco|raposildo|flamingo-dec|cisne-branco|cabeça-de|cabeca-de/.test(n)) cats.push('Decoração');
  if(/raposa|raposildo/.test(n)) cats.push('Raposas');
  if(/tiara|mascara|orelha|coroa|presilha|par-de-luvas|rabo-de-raposa/.test(n)) cats.push('Tiaras & acessórios');
  if(/educativo|montessori|torre-de|castelo-edu|painel-edu|quebra-cab|cubo-com|cubos-com|bolo-edu|lanche-edu|sorvete-edu|tapete-edu|tapete-sens|piramide|bola-arco|bola-quebra|laranja-lar|limao-lim|maca-mont|kit-ferr|kit-pique|kit-fundo|saco-org|camera-foto|tapete-mine/.test(n)) cats.push('Educativo');
  if(/plush|pelucia|baleia|golfinho|tres-porq|ursos-com|ratinho-com|fantoche/.test(n)) cats.push('Plush & pelúcia');
  if(/^flor|tulipa|girassol|morango|boneca-flor|cupido|tiara-frida|touca-de-flor|fantasia-de-flor|fantasia-de-girassol|fantasia-de-morango|fantasia-de-cupido/.test(n)) cats.push('Flores');
  if(/^asa-|^asas-/.test(n)) cats.push('Asas');
  if(/lembrancinha|lembrancinhas|chaveiro|marcador-de-livro|pipas-em|lapis-tem|rabos-de-dino/.test(n)) cats.push('Lembrancinhas');
  if(/bolsa|mochila|toalha/.test(n)) cats.push('Bolsas & mochilas');
  if(/natal|arvore-de-natal|tiara-de-rena|bandeirola-estrela/.test(n)) cats.push('Natal');
  if(cats.length===0) cats.push('Decoração');
  return cats;
}

async function loadFromDB(){
  try{
    const [r,rv]=await Promise.all([
      fetch(SB+'/rest/v1/produtos?select=*&ativo=eq.true&order=name',{headers:HDR}),
      fetch('https://oznpfqsgurztffwfyfec.supabase.co/rest/v1/produto_variacoes?select=produto_id,cor&ativo=eq.true&cor=not.is.null',{headers:HDR})
    ]);
    if(r.ok){
      const data=await r.json();
      if(Array.isArray(data)&&data.length) dbProducts=data;
    }
    if(rv.ok){
      const vars=await rv.json();
      if(Array.isArray(vars)){
        // Group colors by product_id
        const colorMap=new Map();
        vars.forEach(v=>{
          if(!colorMap.has(v.produto_id)) colorMap.set(v.produto_id,[]);
          const arr=colorMap.get(v.produto_id);
          if(!arr.includes(v.cor)) arr.push(v.cor);
        });
        dbProducts.forEach(p=>{ p._cores=colorMap.get(p.id)||[]; });
      }
    }
  }catch(e){}
}

    }
    function getUrlForName(name){
      const slug=name.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
      if(urlMap.has(slug))return urlMap.get(slug);
      const parts=slug.split('-');
      for(let i=parts.length-1;i>=2;i--){
        const k=parts.slice(0,i).join('-');
        if(urlMap.has(k))return urlMap.get(k);
      }
      const short=parts.slice(0,3).join('-');
      const match=FILES.find(f=>f.n.startsWith(short));
      return match?match.u:'';
    }
    function getSecondUrl(name){
      const slug=name.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
      const matches=FILES.filter(f=>f.n.startsWith(slug)||f.n.replace(/\.[^.]+$/,'').split('-').slice(0,-1).join('-')===slug);
      return matches.length>1?matches[1].u:'';
    }
    allProducts=dbProducts
      .filter(p=>p.ativo&&!p.oculto)
      .map(p=>({
        id:p.id,
        name:p.name,
        price:p.price,
        preco_promocional:p.preco_promocional,
        descricao:p.descricao,
        prazo_producao_dias:p.prazo_producao_dias||7,
        collections:p.collections||[],
        destaque:p.destaque||false,
        esgotado:p.esgotado||false,
        url:getUrlForName(p.name),
        url2:getSecondUrl(p.name),
        design:p.design,
        created_at:p.created_at,
      }));
    return;
  }
  allProducts=buildCatalog();
}

function applyFilters(){
  let res=[...allProducts];
  if(currentCat!=='Todas') res=res.filter(p=>(p.collections||[]).some(c=>c.toLowerCase()===currentCat.toLowerCase()));
  if(searchQ){ const q=searchQ.toLowerCase(); res=res.filter(p=>p.name.toLowerCase().includes(q)); }
  if(typeof activeDesigns!=='undefined'&&activeDesigns.length){
    res=res.filter(p=>{
      const designs=Array.isArray(p.design)?p.design:(p.design?[p.design]:[]);
      return activeDesigns.some(slug=>{
        // Match design field
        if(designs.some(d=>d.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z]/g,' ').trim().split(' ')[0]===slug))return true;
        // Fallback: keyword in product name
        return p.name.toLowerCase().includes(slug);
      });
    });
  }
  if(priceMin!==null) res=res.filter(p=>p.price===null||p.price>=priceMin);
  if(priceMax!==null) res=res.filter(p=>p.price===null||p.price<=priceMax);
  if(prazoMax!==null) res=res.filter(p=>(p.prazo_producao_dias||7)<=prazoMax);
  if(activeDesignFilter){
    res=res.filter(p=>{
      const ds=Array.isArray(p.design)?p.design:(p.design?[p.design]:[]);
      return ds.some(d=>d===activeDesignFilter);
    });
  }
  res.sort((a,b)=>{
    if(currentSort==='az') return a.name.localeCompare(b.name,'pt');
    if(currentSort==='za') return b.name.localeCompare(a.name,'pt');
    if(currentSort==='price-asc'){ if(!a.price&&!b.price)return 0; if(!a.price)return 1; if(!b.price)return-1; return a.price-b.price; }
    if(currentSort==='price-desc'){ if(!a.price&&!b.price)return 0; if(!a.price)return 1; if(!b.price)return-1; return b.price-a.price; }
    return 0;
  });
  res.sort((a,b)=>(b.destaque?1:0)-(a.destaque?1:0));
  filtered=res;
  page=1;
  renderGrid();
  renderPagination();
  const lbl=document.getElementById('resultLabel');
  if(lbl) lbl.textContent=filtered.length+' produto'+(filtered.length!==1?'s':'')+(currentCat&&currentCat!=='Todas'?' em '+currentCat:'')+(searchQ?' para "'+searchQ+'"':'');
  document.getElementById('resultCount').textContent=res.length;
}

function renderGrid(){

  const slice=filtered.slice((page-1)*PER_PAGE, page*PER_PAGE);
  if(!slice.length){
    const suggestedCats=['Fantasias','Almofadas','Para bebês','Decoração','Educativo'];
    const catBtns=suggestedCats.map(c=>'<span class="empty-cat" onclick="currentCat=this.dataset.cat;document.getElementById("searchInput").value="";applyFilters()" data-cat="'+c+'">'+c+'</span>').join('');

    return;
  }
  grid.className='prod-grid'+(viewMode==='list'?' list-view':'');
  let featuredUsed=false;
  grid.innerHTML=slice.map(p=>{
    const isFeatured=p.destaque&&!featuredUsed&&viewMode!=='list';
    if(isFeatured)featuredUsed=true;
    const cats=(p.collections||[]).slice(0,2).join(' · ');
    const prazo=p.prazo_producao_dias||7;
    const isNew=p.created_at&&(Date.now()-new Date(p.created_at).getTime())<30*24*60*60*1000;
    const badge=p.destaque?'<span class="pcard-badge badge-destaque">Destaque</span>':isNew?'<span class="pcard-badge badge-novo">Novo</span>':'';

    const img=p.url?`<img src="${p.url}" alt="${p.name}" loading="lazy" onerror="this.style.display='none';this.nextSibling.style.display='flex'">`:'';
    // Swatches from variacoes (colors) — use design tags as fallback
    const colors=(p._cores||[]).slice(0,5);
    const colorMap={
      'rosa':'#f4799a','pink':'#f4799a','azul':'#5b8dee','blue':'#5b8dee',
      'verde':'#4ade80','amarelo':'#fbbf24','vermelho':'#ef4444','roxo':'#a78bfa',
      'laranja':'#fb923c','branco':'#f5f5f5','preto':'#1c1c1c','cinza':'#9ca3af',
      'dourado':'#fcd34d','prata':'#d1d5db','bege':'#e5d5b7','lilás':'#c4b5fd',
    };
    const swatchHtml=colors.length?`<div class="pcard-swatches">${colors.map(c=>{
      const key=c.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
      const bg=Object.entries(colorMap).find(([k])=>key.includes(k))?.[1]||'#e5e7eb';
      return `<span class="swatch" style="background:${bg}" title="${c}"></span>`;
    }).join('')}</div>`:'';

    const priceHtml=p.price
      ?`<div class="pcard-price${p.preco_promocional?' promo':''}">${p.preco_promocional?`<span class="pcard-price-old">${fmt(p.price)}</span>`:''}${fmt(p.preco_promocional||p.price)}</div>
        <button class="btn-add" onclick="event.stopPropagation();addToCart(event,'${p.id}')">+ Adicionar</button>`
      :`<div class="pcard-price" style="font-size:.72rem;color:rgba(12,9,13,.35)">Sob consulta</div>
        <button class="btn-consult" onclick="event.stopPropagation();openWA('${p.name.replace(/'/g,"\\'")}')">Consultar</button>`;
    return `<div class="pcard${isFeatured?' featured-card':''}" onclick="goProduct('${p.id}')">
      <div class="pcard-img">
        ${img}
        <div class="pcard-ph" ${p.url?'style="display:none"':''}>🌸</div>
        ${badge}${newBadge}
        ${p.url?`<button class="lb-trigger" onclick="event.stopPropagation();openLightbox('${p.url}','${p.name.replace(/'/g,"\\'")}')" title="Ver foto">⤢</button>`:''}
      </div>
      <div class="pcard-body">
        <div class="pcard-cat">${cats}</div>
        <div class="pcard-name">${p.name}</div>
        ${swatchHtml}
        <div class="pcard-prazo">⏱ ${prazo} dias úteis</div>
        <div class="pcard-footer">${priceHtml}</div>
      </div>
    </div>`;
  }).join('');
}

function renderPagination(){
  const total=Math.ceil(filtered.length/PER_PAGE);
  const pag=document.getElementById('pagination');
  if(total<=1){pag.innerHTML='';return;}
  let h=`<button class="pag-btn" onclick="goPage(${page-1})" ${page===1?'disabled':''}>‹</button>`;
  for(let i=1;i<=total;i++){
    if(i===1||i===total||Math.abs(i-page)<=2) h+=`<button class="pag-btn ${i===page?'active':''}" onclick="goPage(${i})">${i}</button>`;
    else if(Math.abs(i-page)===3) h+=`<span style="padding:0 4px;color:rgba(13,9,13,.3)">…</span>`;
  }
  h+=`<button class="pag-btn" onclick="goPage(${page+1})" ${page===total?'disabled':''}>›</button>`;
  pag.innerHTML=h;
}
function goPage(p){ page=p; renderGrid(); renderPagination(); window.scrollTo({top:0,behavior:'smooth'}); }

let cart=loadCart();
function saveCart(){
  const payload={data:cart,exp:Date.now()+7*24*60*60*1000};
  localStorage.setItem('cr_cart',JSON.stringify(payload));
  updateCartUI();
}
function loadCart(){
  try{
    const raw=localStorage.getItem('cr_cart');
    if(!raw)return[];
    const p=JSON.parse(raw);
    // Support both old format (array) and new format ({data,exp})
    if(Array.isArray(p))return p;
    if(p.exp&&Date.now()>p.exp){localStorage.removeItem('cr_cart');return[];}
    return p.data||[];
  }catch{return[];}
}
function updateCartUI(){ const el=document.getElementById('cartCount'); if(el) el.textContent=cart.reduce((s,i)=>s+i.qty,0); }

function addToCart(e,id){
  e.stopPropagation();
  const p=allProducts.find(x=>String(x.id)===String(id));
  if(!p)return;
  const ex=cart.find(x=>String(x.id)===String(id));
  if(ex)ex.qty++;
  else cart.push({id:p.id,name:p.name,price:p.price,url:p.url,prazo:p.prazo_producao_dias||7,qty:1});
  saveCart();
  showToast(`<span>${p.name}</span> adicionado ao carrinho`);
}
function removeFromCart(id){ cart=cart.filter(x=>String(x.id)!==String(id)); saveCart(); renderCartDrawer(); }
function changeQty(id,d){ const i=cart.find(x=>String(x.id)===String(id)); if(!i)return; i.qty+=d; if(i.qty<=0)removeFromCart(id); else{saveCart();renderCartDrawer();} }

function renderCartDrawer(){
  const el=document.getElementById('cartItems');
  const foot=document.getElementById('cartFoot');
  if(!cart.length){
    el.innerHTML='<div class="cart-empty"><div style="font-size:3rem;margin-bottom:12px">🛍️</div><p>Carrinho vazio</p></div>';
    foot.style.display='none';return;
  }
  foot.style.display='block';
  const maxPrazo=Math.max(...cart.map(i=>i.prazo||7));
  document.getElementById('cartPrazoText').textContent=`⏱ Prazo estimado: ${maxPrazo} dias úteis após confirmação do pagamento.`;
  document.getElementById('cartTotal').textContent='R$ '+cart.reduce((s,i)=>s+(i.price||0)*i.qty,0).toFixed(2).replace('.',',');
  el.innerHTML=cart.map(i=>`
    <div class="cart-item">
      <div class="ci-img">${i.url?`<img src="${i.url}" loading="lazy">`:'<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:1.5rem">🌸</div>'}</div>
      <div>
        <div class="ci-name">${i.name}</div>
        <div class="ci-prazo">⏱ ${i.prazo||7} dias úteis</div>
        <div class="ci-qty">
          <button class="qty-btn" onclick="changeQty('${i.id}',-1)">−</button>
          <span class="qty-val">${i.qty}</span>
          <button class="qty-btn" onclick="changeQty('${i.id}',1)">+</button>
        </div>
      </div>
      <div style="display:flex;flex-direction:column;align-items:flex-end;gap:8px">
        <div class="ci-price">${i.price?'R$ '+(i.price*i.qty).toFixed(2).replace('.',','):'—'}</div>
        <button class="ci-remove" onclick="removeFromCart('${i.id}')">🗑</button>
      </div>
    </div>`).join('');
}

// ── FEATURED STRIP ──────────────────────────────────────────────────
function renderFeaturedStrip(){
  const dest=allProducts.filter(p=>p.destaque);
  if(!dest.length)return;
  const strip=document.getElementById('featuredStrip');
  const scroll=document.getElementById('featuredScroll');
  if(!strip||!scroll)return;
  strip.style.display='block';
  scroll.innerHTML=dest.slice(0,14).map(p=>{
    const priceHtml=p.price
      ?`<div class="scard-price${p.preco_promocional?' promo':''}">${fmt(p.preco_promocional||p.price)}</div>`
      :`<div class="scard-price" style="color:rgba(12,9,13,.4);font-size:.72rem">Sob consulta</div>`;
    const img=p.url?`<img src="${p.url}" alt="${p.name}" loading="lazy" onerror="this.style.display='none';this.nextSibling.style.display='flex'">`:'';
    return `<div class="scard" onclick="goProduct('${p.id}')">
      <div class="scard-img">${img}<div class="scard-img-ph" ${p.url?'style="display:none"':''}>🌸</div><span class="scard-badge-dest">Destaque</span></div>
      <div class="scard-info"><div class="scard-name">${p.name}</div>${priceHtml}</div>
    </div>`;
  }).join('');
}
let _stripDone=false;
const _origApply=applyFilters;
applyFilters=function(){
  _origApply();
  if(!_stripDone&&allProducts.length){renderFeaturedStrip();
  renderDesignChips();_stripDone=true;}
};

// ── HERO SLIDESHOW ──────────────────────────────────────────────
(function(){
  const slides=document.querySelectorAll('.hero-slide');
  const dots=document.querySelectorAll('.hero-dot');
  if(!slides.length)return;
  let cur=0,timer;
  function goTo(n){
    slides[cur].classList.remove('active');
    dots[cur].classList.remove('active');
    cur=(n+slides.length)%slides.length;
    slides[cur].classList.add('active');
    dots[cur].classList.add('active');
  }
  function next(){goTo(cur+1)}
  function start(){timer=setInterval(next,4500)}
  function stop(){clearInterval(timer)}
  start();
  dots.forEach(d=>d.addEventListener('click',()=>{stop();goTo(+d.dataset.idx);start()}));
  const hero=document.querySelector('.shop-hero');
  if(hero){hero.addEventListener('mouseenter',stop);hero.addEventListener('mouseleave',start)}
})();
