<style>
:root{
  --dark:#0c090d;--dark2:#171119;--dark3:#201624;
  --pink:#f4799a;--pink2:#fbaec3;--rose:#e8527c;
  --cream:#fff9f6;--white:#fff;--green:#22c55e;--red:#ef4444;
  --fd:'Playfair Display',Georgia,serif;
  --fb:'DM Sans',sans-serif;
  --r:16px;--rl:28px;--rxl:48px;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--cream);color:var(--dark);font-family:var(--fb);min-height:100vh}
a{text-decoration:none;color:inherit}
img{display:block;max-width:100%}
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-thumb{background:var(--pink);border-radius:3px}

/* NAV */
nav{background:var(--dark);padding:0 48px;height:66px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;border-bottom:1px solid rgba(244,121,154,.12)}
.nav-logo canvas{height:36px;width:auto}
.nav-right{display:flex;align-items:center;gap:16px}
.nav-link{color:rgba(255,255,255,.5);font-size:.85rem;font-weight:500;transition:color .2s}
.nav-link:hover{color:var(--pink2)}
.nav-btn{background:var(--pink);color:#fff;border:none;border-radius:100px;padding:9px 20px;font-family:var(--fb);font-size:.82rem;font-weight:600;cursor:pointer;transition:all .2s}
.nav-btn:hover{background:var(--rose)}

/* LAYOUT */
.page-wrap{max-width:1100px;margin:0 auto;padding:40px 24px 80px}

/* LOGIN SCREEN */
.login-screen{min-height:calc(100vh - 66px);display:flex;align-items:center;justify-content:center;padding:40px 24px}
.login-card{background:#fff;border-radius:var(--rxl);padding:52px 48px;width:100%;max-width:440px;box-shadow:0 24px 80px rgba(244,121,154,.1);border:1px solid rgba(244,121,154,.1);text-align:center}
.login-card canvas{margin:0 auto 24px}
.login-card h1{font-family:var(--fd);font-size:1.6rem;font-weight:700;margin-bottom:8px}
.login-card p{color:rgba(13,9,13,.45);font-size:.9rem;margin-bottom:32px;line-height:1.6}
.oauth-btn{width:100%;display:flex;align-items:center;justify-content:center;gap:12px;padding:13px 20px;border-radius:12px;border:1.5px solid rgba(13,9,13,.1);background:#fff;font-family:var(--fb);font-size:.9rem;font-weight:500;cursor:pointer;transition:all .2s;margin-bottom:10px;color:var(--dark)}
.oauth-btn:hover{border-color:var(--pink);background:rgba(244,121,154,.04);transform:translateY(-1px)}
.oauth-icon{width:22px;height:22px;flex-shrink:0}
.divider{display:flex;align-items:center;gap:12px;margin:16px 0;color:rgba(13,9,13,.3);font-size:.8rem}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:rgba(13,9,13,.1)}
.email-form input{width:100%;padding:11px 14px;border:1.5px solid rgba(13,9,13,.12);border-radius:11px;font-family:var(--fb);font-size:.88rem;outline:none;margin-bottom:10px;transition:border-color .2s}
.email-form input:focus{border-color:var(--pink)}
.btn-email{width:100%;background:var(--dark);color:#fff;border:none;border-radius:100px;padding:13px;font-family:var(--fb);font-size:.9rem;font-weight:600;cursor:pointer;transition:all .2s}
.btn-email:hover{background:var(--dark2)}
.login-err{color:var(--red);font-size:.8rem;margin-top:10px;display:none}
.login-switch{font-size:.82rem;color:rgba(13,9,13,.45);margin-top:16px}
.login-switch a{color:var(--rose);cursor:pointer;font-weight:600}

/* HEADER AREA */
.acct-header{background:linear-gradient(135deg,var(--dark2),var(--dark3));border-radius:var(--rxl);padding:36px 40px;margin-bottom:28px;display:flex;align-items:center;gap:24px;position:relative;overflow:hidden}
.acct-header::before{content:'🌸';position:absolute;right:-10px;top:-10px;font-size:10rem;opacity:.05;line-height:1}
.avatar{width:72px;height:72px;border-radius:50%;background:linear-gradient(135deg,var(--pink),var(--rose));display:flex;align-items:center;justify-content:center;font-size:1.8rem;flex-shrink:0;border:3px solid rgba(244,121,154,.3);overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
.acct-info h2{font-family:var(--fd);font-size:1.3rem;font-weight:700;color:#fff;margin-bottom:4px}
.acct-info p{color:rgba(255,255,255,.45);font-size:.85rem}
.acct-badge{background:rgba(244,121,154,.15);border:1px solid rgba(244,121,154,.25);color:var(--pink2);border-radius:100px;padding:4px 12px;font-size:.72rem;font-weight:600;letter-spacing:.05em;margin-top:8px;display:inline-block}

/* TABS */
.tabs{display:flex;gap:4px;margin-bottom:24px;background:#fff;border-radius:14px;padding:5px;border:1px solid rgba(244,121,154,.08)}
.tab{flex:1;padding:10px;border-radius:10px;border:none;background:transparent;font-family:var(--fb);font-size:.85rem;font-weight:500;cursor:pointer;transition:all .2s;color:rgba(13,9,13,.45);text-align:center}
.tab.active{background:var(--pink);color:#fff;font-weight:600;box-shadow:0 4px 14px rgba(244,121,154,.3)}
.tab-content{display:none}
.tab-content.active{display:block}

/* ORDERS */
.order-card{background:#fff;border-radius:var(--rl);border:1px solid rgba(244,121,154,.08);margin-bottom:14px;overflow:hidden;transition:all .2s}
.order-card:hover{border-color:rgba(244,121,154,.2);box-shadow:0 8px 28px rgba(244,121,154,.07)}
.order-head{display:grid;grid-template-columns:auto 1fr auto auto;gap:16px;align-items:center;padding:18px 20px;cursor:pointer}
.order-num{font-family:var(--fd);font-size:1rem;font-weight:700;color:var(--dark)}
.order-date{font-size:.78rem;color:rgba(13,9,13,.38);margin-top:3px}
.order-total{font-weight:700;font-size:1rem}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:100px;padding:4px 12px;font-size:.72rem;font-weight:700}
.pill.pendente{background:rgba(245,158,11,.1);color:#d97706}
.pill.pago{background:rgba(34,197,94,.1);color:var(--green)}
.pill.producao{background:rgba(244,121,154,.1);color:var(--rose)}
.pill.enviado{background:rgba(99,102,241,.1);color:#6366f1}
.pill.entregue{background:rgba(34,197,94,.15);color:var(--green)}
.pill.cancelado{background:rgba(239,68,68,.08);color:var(--red)}
.order-body{border-top:1px solid rgba(244,121,154,.08);padding:18px 20px;display:none}
.order-body.open{display:block}
.order-items{display:flex;flex-direction:column;gap:10px;margin-bottom:14px}
.oi{display:flex;gap:12px;align-items:center}
.oi-img{width:52px;height:52px;border-radius:10px;overflow:hidden;background:var(--cream);flex-shrink:0;position:relative}
.oi-img img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.oi-name{font-size:.88rem;font-weight:600;line-height:1.3}
.oi-qty{font-size:.75rem;color:rgba(13,9,13,.4);margin-top:2px}
.oi-price{margin-left:auto;font-weight:700;font-size:.9rem;white-space:nowrap}
.order-track{display:flex;gap:0;margin-top:14px;padding-top:14px;border-top:1px solid rgba(244,121,154,.08)}
.track-step{flex:1;text-align:center;position:relative}
.track-step::before{content:'';position:absolute;top:12px;left:-50%;right:50%;height:2px;background:rgba(244,121,154,.15);z-index:0}
.track-step:first-child::before{display:none}
.track-step.done::before{background:var(--pink)}
.track-dot{width:24px;height:24px;border-radius:50%;border:2px solid rgba(244,121,154,.2);background:#fff;margin:0 auto 6px;display:flex;align-items:center;justify-content:center;font-size:.65rem;position:relative;z-index:1;transition:all .3s}
.track-step.done .track-dot{background:var(--pink);border-color:var(--pink);color:#fff}
.track-step.current .track-dot{background:#fff;border-color:var(--pink);box-shadow:0 0 0 3px rgba(244,121,154,.2)}
.track-label{font-size:.65rem;color:rgba(13,9,13,.38);font-weight:500}
.track-step.done .track-label,.track-step.current .track-label{color:var(--rose);font-weight:600}
.btn-wa{display:inline-flex;align-items:center;gap:8px;background:#25d366;color:#fff;border:none;border-radius:100px;padding:9px 18px;font-family:var(--fb);font-size:.8rem;font-weight:600;cursor:pointer;transition:all .2s;margin-top:10px}
.btn-wa:hover{background:#128c44}

/* EMPTY STATE */
.empty{text-align:center;padding:64px 24px;color:rgba(13,9,13,.3)}
.empty-icon{font-size:3.5rem;margin-bottom:14px}
.empty h3{font-family:var(--fd);font-size:1.1rem;color:rgba(13,9,13,.45);margin-bottom:8px}
.empty p{font-size:.85rem;line-height:1.7}
.empty a{color:var(--rose);font-weight:600}

/* FAVORITES */
.fav-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:16px}
.fav-card{background:#fff;border-radius:var(--rl);overflow:hidden;border:1px solid rgba(244,121,154,.08);transition:all .3s;cursor:pointer;position:relative}
.fav-card:hover{transform:translateY(-4px);border-color:rgba(244,121,154,.25);box-shadow:0 12px 36px rgba(244,121,154,.1)}
.fav-img{aspect-ratio:1;overflow:hidden;background:var(--cream);position:relative}
.fav-img img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.fav-img-ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:2rem}
.fav-info{padding:12px 14px 14px}
.fav-name{font-family:var(--fd);font-size:.9rem;font-weight:700;line-height:1.3;margin-bottom:5px}
.fav-price{font-size:.85rem;font-weight:600;color:var(--rose)}
.fav-rm{position:absolute;top:8px;right:8px;width:28px;height:28px;border-radius:50%;background:rgba(239,68,68,.85);border:none;cursor:pointer;color:#fff;font-size:.8rem;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .2s}
.fav-card:hover .fav-rm{opacity:1}

/* ADDRESS */
.addr-card{background:#fff;border-radius:var(--rl);border:1px solid rgba(244,121,154,.08);padding:22px 24px;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.addr-info p{font-size:.88rem;line-height:1.8;color:rgba(13,9,13,.6)}
.addr-info b{color:var(--dark);font-size:.95rem}
.fg{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.fg label{font-size:.72rem;font-weight:600;color:rgba(13,9,13,.45);letter-spacing:.02em}
.fg input,.fg select{padding:10px 12px;border:1.5px solid rgba(244,121,154,.18);border-radius:10px;font-family:var(--fb);font-size:.86rem;outline:none;transition:border-color .2s}
.fg input:focus,.fg select:focus{border-color:var(--pink)}
.frow{display:grid;gap:10px}
.frow.c2{grid-template-columns:1fr 1fr}
.frow.c3{grid-template-columns:2fr 1fr 1fr}
.btn-p{background:var(--pink);color:#fff;border:none;border-radius:100px;padding:12px 28px;font-family:var(--fb);font-size:.88rem;font-weight:600;cursor:pointer;transition:all .2s}
.btn-p:hover{background:var(--rose);transform:translateY(-1px)}
.btn-s{background:transparent;color:var(--rose);border:1.5px solid rgba(244,121,154,.25);border-radius:100px;padding:12px 28px;font-family:var(--fb);font-size:.88rem;font-weight:600;cursor:pointer;transition:all .2s}
.btn-s:hover{background:rgba(244,121,154,.06)}

/* TOAST */
.toast{position:fixed;bottom:24px;right:24px;padding:11px 20px;border-radius:11px;font-size:.84rem;z-index:999;transform:translateY(60px);transition:transform .3s;pointer-events:none;color:#fff;box-shadow:0 8px 24px rgba(0,0,0,.12)}
.toast.show{transform:translateY(0)}
.toast.ok{background:#16a34a}
.toast.err{background:var(--red)}
.toast.info{background:var(--dark)}

/* LOADING */
.ld{text-align:center;padding:48px;display:flex;flex-direction:column;align-items:center;gap:12px;color:rgba(13,9,13,.3)}
.spin{width:22px;height:22px;border:2px solid rgba(244,121,154,.2);border-top-color:var(--pink);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

@media(max-width:768px){
  nav{padding:0 16px}
  .page-wrap{padding:20px 16px 60px}
  .acct-header{padding:24px 20px}
  .tabs{gap:2px}
  .tab{font-size:.75rem;padding:9px 6px}
  .order-head{grid-template-columns:1fr auto}
  .fav-grid{grid-template-columns:1fr 1fr}
  .login-card{padding:36px 24px}
  .frow.c2,.frow.c3{grid-template-columns:1fr}
}
</style>
</head>

function mkLogo(el,h){
  const c=document.createElement('canvas');
  const img=new Image();
  img.onload=()=>{
    const sc=h/img.naturalHeight;c.width=Math.round(img.naturalWidth*sc);c.height=h;
    c.style.height=h+'px';c.style.width='auto';
    const ctx=c.getContext('2d');ctx.drawImage(img,0,0,c.width,c.height);
    const d=ctx.getImageData(0,0,c.width,c.height);
    for(let i=0;i<d.data.length;i+=4){const br=(d.data[i]+d.data[i+1]+d.data[i+2])/3;if(br<36)d.data[i+3]=0;else if(br<75)d.data[i+3]=Math.round(((br-36)/39)*255);}
    ctx.putImageData(d,0,0);el.appendChild(c);
  };img.src=LOGO_URI;
}

function fmt(v){return v!=null?'R$ '+parseFloat(v).toFixed(2).replace('.',','):'—';}
function fmtDate(d){return d?new Date(d).toLocaleDateString('pt-BR',{day:'2-digit',month:'long',year:'numeric'}):'—';}
let toastT;
function toast(msg,type='info'){const t=document.getElementById('toast');t.textContent=msg;t.className='toast show '+type;clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),3200);}

async function sbGet(path){try{const r=await fetch(SB+path,{headers:HDR});return r.ok?r.json():[];}catch{return[];}}
async function sbPost(path,body){try{const r=await fetch(SB+path,{method:'POST',headers:{...HDR,'Prefer':'return=representation'},body:JSON.stringify(body)});return r.ok?r.json():null;}catch{return null;}}
async function sbPatch(path,body){try{const r=await fetch(SB+path,{method:'PATCH',headers:{...HDR,'Prefer':'return=representation'},body:JSON.stringify(body)});return r.ok?r.json():null;}catch{return null;}}

// ── FILES INDEX ───────────────────────────────────────────────────────
const fileIdx=new Map();
for(const f of FILES){
  const base=f.n.replace(/\.[^.]+$/,'');
  const prefix=base.includes('-')?base.substring(0,base.lastIndexOf('-')):base;
  if(!fileIdx.has(prefix))fileIdx.set(prefix,f.u);
}
function getUrl(name){
  const slug=name.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
  if(fileIdx.has(slug))return fileIdx.get(slug);
  const parts=slug.split('-');
  for(let i=parts.length-1;i>=2;i--){const k=parts.slice(0,i).join('-');if(fileIdx.has(k))return fileIdx.get(k);}
  const m=FILES.find(f=>f.n.startsWith(slug.split('-').slice(0,3).join('-')));
  return m?m.u:'';
}

async function loginOAuth(provider){
  const {error}=await sbClient.auth.signInWithOAuth({
    provider,
    options:{redirectTo:window.location.href.split('?')[0]+'?auth=1'}
  });
  if(error)toast('Erro ao entrar com '+provider,'err');
}

async function loginEmail(){
  const email=document.getElementById('emailInput').value.trim();
  const pass=document.getElementById('passInput').value;
  if(!email||!pass){toast('Preencha e-mail e senha','err');return;}
  const btn=document.getElementById('emailBtn');
  btn.textContent='Aguarde...';btn.disabled=true;
  const fn=isSignUp?sbClient.auth.signUp:sbClient.auth.signInWithPassword;
  const {data,error}=await fn.call(sbClient.auth,{email,password:pass});
  btn.disabled=false;btn.textContent=isSignUp?'Criar conta':'Entrar com e-mail';
  if(error){
    document.getElementById('loginErr').textContent=error.message;
    document.getElementById('loginErr').style.display='block';
    return;
  }
  if(isSignUp&&!data.session){
    toast('Verifique seu e-mail para confirmar a conta','info');
    return;
  }
  if(data.session){HDR.Authorization='Bearer '+data.session.access_token;onLogin(data.session);}
}

function toggleMode(){
  isSignUp=!isSignUp;
  document.getElementById('emailBtn').textContent=isSignUp?'Criar conta':'Entrar com e-mail';
  document.getElementById('switchText').innerHTML=isSignUp
    ?'Já tem conta? <a onclick="toggleMode()">Entrar</a>'
    :'Não tem conta? <a onclick="toggleMode()">Criar conta</a>';
  document.getElementById('loginErr').style.display='none';
}

async function logout(){
  await sbClient.auth.signOut();
  location.reload();
}

// ── ON LOGIN ──────────────────────────────────────────────────────────
async function onLogin(session){
  currentSession=session;
  currentUser=session.user;
  HDR.Authorization='Bearer '+session.access_token;

  // Show account, hide login
  document.getElementById('loginScreen').style.display='none';
  document.getElementById('accountScreen').style.display='block';
  document.getElementById('navLoginBtn').style.display='none';
  document.getElementById('navUserName').style.display='flex';
  document.getElementById('navUserName').textContent=currentUser.user_metadata?.full_name?.split(' ')[0]||currentUser.email?.split('@')[0]||'Conta';

  // Set avatar
  const avatarEl=document.getElementById('userAvatar');
  const pic=currentUser.user_metadata?.avatar_url;
  if(pic)avatarEl.innerHTML=`<img src="${pic}" alt="">`;
  else avatarEl.textContent=(currentUser.user_metadata?.full_name?.[0]||currentUser.email?.[0]||'?').toUpperCase();

  // Set name/email
  const name=currentUser.user_metadata?.full_name||currentUser.email?.split('@')[0]||'';
  document.getElementById('userName').textContent=name;
  document.getElementById('userEmail').textContent=currentUser.email||'';
  document.getElementById('memberSince').textContent='Membro desde '+fmtDate(currentUser.created_at);

  // Autofill address form
  if(name)document.getElementById('addrNome').value=name;
  if(currentUser.email)document.getElementById('addrEmail').value=currentUser.email;

  await Promise.all([loadOrders(),loadFavorites(),loadAddress()]);

  // Vincular pedidos antigos pelo email
  if(currentUser.email){
    await sbPatch(`/rest/v1/pedidos?visitante_email=eq.${encodeURIComponent(currentUser.email)}&user_id=is.null`,
      {user_id:currentUser.id});
  }
}

// ── ORDERS ────────────────────────────────────────────────────────────
async function loadOrders(){
  const email=currentUser?.email;
  if(!email)return;
  const d=await sbGet(`/rest/v1/pedidos?select=*&or=(user_id.eq.${currentUser.id},visitante_email.eq.${encodeURIComponent(email)})&order=created_at.desc`);
  orders=Array.isArray(d)?d:[];
  renderOrders();
  document.getElementById('tab-orders').textContent=`📦 Pedidos (${orders.length})`;
}

const STATUS_STEPS=['pendente','pago','producao','enviado','entregue'];
const STATUS_LABELS={pendente:'⏳ Aguardando',pago:'✅ Pago',producao:'🔨 Em produção',enviado:'🚚 Enviado',entregue:'📬 Entregue',cancelado:'❌ Cancelado'};

function renderOrders(){
  const el=document.getElementById('ordersList');
  if(!orders.length){
    el.innerHTML=`<div class="empty"><div class="empty-icon">📦</div><h3>Nenhum pedido ainda</h3><p>Quando você fizer um pedido ele aparece aqui.<br><a href="loja.html">Explorar a loja →</a></p></div>`;
    return;
  }
  el.innerHTML=orders.map(o=>{
    const stepIdx=STATUS_STEPS.indexOf(o.status);
    const isCanceled=o.status==='cancelado';
    const steps=STATUS_STEPS.map((s,i)=>{
      const done=!isCanceled&&i<=stepIdx;
      const curr=!isCanceled&&i===stepIdx;
      const icons={pendente:'⏳',pago:'✅',producao:'🔨',enviado:'🚚',entregue:'📬'};
      return `<div class="track-step ${done?'done':''} ${curr?'current':''}">
        <div class="track-dot">${done||curr?icons[s]:''}</div>
        <div class="track-label">${s==='pendente'?'Pedido':s==='pago'?'Pago':s==='producao'?'Produção':s==='enviado'?'Enviado':'Entregue'}</div>
      </div>`;
    }).join('');
    return `<div class="order-card">
      <div class="order-head" onclick="toggleOrder(${o.id})">
        <div>
          <div class="order-num">Pedido #${o.id}</div>
          <div class="order-date">${fmtDate(o.created_at)}</div>
        </div>
        <div class="order-total">${fmt(o.total)}</div>
        <span class="pill ${o.status}">${STATUS_LABELS[o.status]||o.status}</span>
        <span style="color:rgba(13,9,13,.3);font-size:.9rem" id="arr-${o.id}">▾</span>
      </div>
      <div class="order-body" id="body-${o.id}">
        ${!isCanceled?`<div class="order-track">${steps}</div>`:'<p style="color:var(--red);font-size:.85rem;margin-bottom:10px">Este pedido foi cancelado.</p>'}
        <div class="order-items" id="items-${o.id}"><div class="ld"><div class="spin"></div></div></div>
        ${o.visitante_telefone?`<button class="btn-wa" onclick="contactWA('${o.visitante_telefone?.replace(/\D/g,'')}','${o.id}')">💬 Falar sobre este pedido</button>`:''}</div>
    </div>`;
  }).join('');
}

function toggleOrder(id){
  const body=document.getElementById('body-'+id);
  const arr=document.getElementById('arr-'+id);
  const isOpen=body.classList.toggle('open');
  arr.textContent=isOpen?'▴':'▾';
  if(isOpen)loadOrderItems(id);
}

async function loadOrderItems(orderId){
  const el=document.getElementById('items-'+orderId);
  if(!el||el.dataset.loaded)return;
  el.dataset.loaded='1';
  const items=await sbGet(`/rest/v1/itens_pedido?select=*&pedido_id=eq.${orderId}`);
  if(!Array.isArray(items)||!items.length){el.innerHTML='<p style="font-size:.82rem;color:rgba(13,9,13,.38)">Detalhes não disponíveis</p>';return;}
  el.innerHTML=items.map(it=>{
    const url=getUrl(it.nome_produto||'');
    return `<div class="oi">
      <div class="oi-img">${url?`<img src="${url}" loading="lazy">`:'<span style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center">🌸</span>'}</div>
      <div><div class="oi-name">${it.nome_produto||'Produto'}</div><div class="oi-qty">Qtd: ${it.quantidade||1}</div></div>
      <div class="oi-price">${fmt(it.subtotal)}</div>
    </div>`;
  }).join('');
}

function contactWA(tel,orderId){
  window.open(`https://wa.me/55${tel}?text=${encodeURIComponent('Olá! Gostaria de saber sobre o pedido #'+orderId)}`, '_blank');
}

// ── FAVORITES ─────────────────────────────────────────────────────────
async function loadFavorites(){
  if(!currentUser)return;
  const d=await sbGet(`/rest/v1/favoritos?select=produto_id,produtos(name,price,collections)&user_id=eq.${currentUser.id}`);
  favorites=Array.isArray(d)?d:[];
  renderFavorites();
  document.getElementById('tab-favs').textContent=`❤️ Favoritos (${favorites.length})`;
}

function renderFavorites(){
  const el=document.getElementById('favsList');
  if(!favorites.length){
    el.innerHTML=`<div class="empty"><div class="empty-icon">❤️</div><h3>Nenhum favorito ainda</h3><p>Clique no ❤️ em qualquer produto para salvar aqui.<br><a href="loja.html">Explorar a loja →</a></p></div>`;
    return;
  }
  el.innerHTML=`<div class="fav-grid">${favorites.map(f=>{
    const p=f.produtos||{};
    const url=getUrl(p.name||'');
    const price=p.price?fmt(p.price):'';
    return `<div class="fav-card" onclick="window.location.href='loja.html'">
      <div class="fav-img">${url?`<img src="${url}" loading="lazy">`:'<div class="fav-img-ph">🌸</div>'}</div>
      <div class="fav-info">
        <div class="fav-name">${p.name||'Produto'}</div>
        ${price?`<div class="fav-price">${price}</div>`:''}
      </div>
      <button class="fav-rm" onclick="event.stopPropagation();removeFav(${f.produto_id})" title="Remover">×</button>
    </div>`;
  }).join('')}</div>`;
}

async function removeFav(prodId){
  await sbDelete(`/rest/v1/favoritos?user_id=eq.${currentUser.id}&produto_id=eq.${prodId}`);
  favorites=favorites.filter(f=>f.produto_id!==prodId);
  renderFavorites();
  document.getElementById('tab-favs').textContent=`❤️ Favoritos (${favorites.length})`;
  toast('Removido dos favoritos','ok');
}

// ── ADDRESS ────────────────────────────────────────────────────────────
async function loadAddress(){
  if(!currentUser)return;
  const d=await sbGet(`/rest/v1/enderecos_salvos?user_id=eq.${currentUser.id}&limit=1`);
  if(Array.isArray(d)&&d.length){
    savedAddress=d[0];
    fillAddressForm(savedAddress);
    renderSavedAddress();
  }
}

function fillAddressForm(addr){
  if(!addr)return;
  ['logradouro','numero','complemento','bairro','cidade','estado','cep'].forEach(f=>{
    const el=document.getElementById('addr'+f.charAt(0).toUpperCase()+f.slice(1));
    if(el&&addr[f])el.value=addr[f];
  });
}

function renderSavedAddress(){
  const el=document.getElementById('savedAddr');
  if(!el||!savedAddress)return;
  el.innerHTML=`<div class="addr-card">
    <div class="addr-info">
      <b>Endereço principal</b>
      <p>${[savedAddress.logradouro,savedAddress.numero,savedAddress.complemento,savedAddress.bairro].filter(Boolean).join(', ')}<br>
      ${savedAddress.cidade} — ${savedAddress.estado} &nbsp; CEP ${savedAddress.cep}</p>
    </div>
    <button class="btn-s" style="padding:8px 16px;font-size:.78rem" onclick="document.getElementById('addrForm').scrollIntoView({behavior:'smooth'})">Editar</button>
  </div>`;
}

async function saveAddress(){
  if(!currentUser)return;
  const addr={
    user_id:currentUser.id,
    nome:document.getElementById('addrNome').value.trim(),
    email:document.getElementById('addrEmail').value.trim(),
    telefone:document.getElementById('addrTelefone').value.trim(),
    cep:document.getElementById('addrCep').value.trim().replace(/\D/g,''),
    logradouro:document.getElementById('addrLogradouro').value.trim(),
    numero:document.getElementById('addrNumero').value.trim(),
    complemento:document.getElementById('addrComplemento').value.trim(),
    bairro:document.getElementById('addrBairro').value.trim(),
    cidade:document.getElementById('addrCidade').value.trim(),
    estado:document.getElementById('addrEstado').value.trim(),
  };
  if(!addr.logradouro||!addr.cidade){toast('Preencha pelo menos rua e cidade','err');return;}
  if(savedAddress){
    await sbPatch(`/rest/v1/enderecos_salvos?id=eq.${savedAddress.id}`,addr);
  }else{
    await sbPost('/rest/v1/enderecos_salvos',addr);
  }
  toast('Endereço salvo!','ok');
  await loadAddress();
}

// CEP autocomplete
document.getElementById('addrCep')?.addEventListener('blur',async function(){
  const cep=this.value.replace(/\D/g,'');
  if(cep.length!==8)return;
  try{
    const r=await fetch(`https://viacep.com.br/ws/${cep}/json/`);
    const d=await r.json();
    if(d.erro)return;
    document.getElementById('addrLogradouro').value=d.logradouro||'';
    document.getElementById('addrBairro').value=d.bairro||'';
    document.getElementById('addrCidade').value=d.localidade||'';
    document.getElementById('addrEstado').value=d.uf||'';
  }catch{}
});

// ── TABS ──────────────────────────────────────────────────────────────
function goTab(name){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(t=>t.classList.remove('active'));
  document.getElementById('tab-'+name).classList.add('active');
  document.getElementById('content-'+name).classList.add('active');
}

// ── INIT ──────────────────────────────────────────────────────────────
(async()=>{
  const {data:{session}}=await sbClient.auth.getSession();
  if(session){
    HDR.Authorization='Bearer '+session.access_token;
    await onLogin(session);
  }
  sbClient.auth.onAuthStateChange(async(event,session)=>{
    if(event==='SIGNED_IN'&&session){
      HDR.Authorization='Bearer '+session.access_token;
      await onLogin(session);
    }
    if(event==='SIGNED_OUT')location.reload();
  });
})();

mkLogo(document.getElementById('loginLogo'),60);
document.getElementById('navLogoutBtn').style.display='none';
// Show logout btn when logged in
const _origOnLogin=onLogin;
</script>
