<style>
:root{
  --dark:var(--ink);--dark2:#171119;--dark3:#201624;
  --white:#fff;
  --r:16px;--rl:28px;
}
[data-theme="dark"]{
  --cream:#15101a;--white:#1e1722;--ink:#f0e8ec;--muted:rgba(240,232,236,.66);
  --dark:#f0e8ec;--dark2:#2a2030;--dark3:#352a3d;
}
[data-theme="dark"] body{background:var(--cream)}
[data-theme="dark"] img{filter:brightness(.94)}
[data-theme="dark"] input,[data-theme="dark"] select,[data-theme="dark"] textarea{background:var(--white);color:var(--dark);border-color:rgba(244,121,154,.2)}
[data-theme="dark"] ::-webkit-scrollbar-thumb{background:var(--pink2)}
*{margin:0;padding:0;box-sizing:border-box}
body,nav,header,footer{transition:background-color .3s ease,color .3s ease,border-color .3s ease}
html{scroll-behavior:smooth}
body{background:var(--cream);color:var(--dark);font-family:var(--fb);min-height:100vh}
a{text-decoration:none;color:inherit}
img{display:block;max-width:100%}
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-thumb{background:var(--pink);border-radius:3px}


/* BREADCRUMB */
.breadcrumb{padding:16px 48px;font-size:.8rem;color:var(--muted);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.breadcrumb a{color:var(--muted);transition:color .2s}
.breadcrumb a:hover{color:var(--rose)}
.breadcrumb span{color:var(--dark)}

/* LAYOUT */
.page{max-width:1200px;margin:0 auto;padding:32px 48px 80px;display:grid;grid-template-columns:1fr 1fr;gap:64px;align-items:start}

/* GALLERY */
.gallery{position:sticky;top:calc(var(--nav-h) + 20px)}
.gallery-main{aspect-ratio:1;border-radius:var(--rl);overflow:hidden;background:var(--dark3);position:relative;margin-bottom:12px;cursor:zoom-in}
.gallery-main img{width:100%;height:100%;object-fit:cover;transition:transform .4s}
.gallery-main:hover img{transform:scale(1.04)}
.gallery-main .ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:6rem;background:linear-gradient(135deg,#1a1020,#231427)}
.gallery-thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumb{width:72px;height:72px;border-radius:10px;overflow:hidden;cursor:pointer;border:2px solid transparent;transition:all .2s;background:var(--dark3);flex-shrink:0}
.thumb.active{border-color:var(--pink)}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb .th-ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:1.4rem}

/* PRODUCT INFO */
.pinfo{padding-top:8px}
.pinfo-cat{font-size:.75rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--rose);margin-bottom:12px;display:flex;align-items:center;gap:8px}
.pinfo h1{font-family:var(--fd);font-size:var(--fs-h1);font-weight:600;line-height:1.08;letter-spacing:-.02em;margin-bottom:16px}
.pinfo-price{display:flex;align-items:baseline;gap:10px;margin-bottom:8px}
.pinfo-price .val{font-family:var(--fd);font-size:2rem;font-weight:600;color:var(--rose);font-variant-numeric:tabular-nums lining-nums}
.pinfo-price .old{font-size:1rem;color:var(--muted);text-decoration:line-through}
.pinfo-prazo{font-size:.8rem;color:var(--muted);margin-bottom:24px;display:flex;align-items:center;gap:6px}
.pinfo-prazo svg{color:var(--pink);flex-shrink:0}
.divider{height:1px;background:rgba(244,121,154,.12);margin:20px 0}

/* VARIATIONS */
.var-section h3{font-size:.75rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.var-group{margin-bottom:16px}
.var-label{font-size:.82rem;font-weight:600;margin-bottom:8px;color:var(--dark)}
.var-options{display:flex;gap:8px;flex-wrap:wrap}
.var-opt{padding:8px 16px;border-radius:100px;border:1.5px solid rgba(13,9,13,.12);font-family:var(--fb);font-size:.82rem;font-weight:500;cursor:pointer;transition:all .2s;background:#fff}
.var-opt:hover{border-color:var(--pink);color:var(--rose)}
.var-opt.active{border-color:var(--pink);background:var(--pink-strong);color:#fff}
.var-opt.esgotado{opacity:.35;cursor:not-allowed;text-decoration:line-through}
.var-extra{font-size:.75rem;color:var(--rose);margin-left:4px}

/* QUANTITY */
.qty-row{display:flex;align-items:center;gap:12px;margin-bottom:20px}
.qty-label{font-size:.82rem;font-weight:600;color:var(--dark)}
.qty-ctrl{display:flex;align-items:center;gap:0;border:1.5px solid rgba(13,9,13,.12);border-radius:100px;overflow:hidden;background:var(--white)}
[data-theme="dark"] .qty-ctrl{border-color:rgba(244,121,154,.2)}
.qty-btn{width:36px;height:36px;border:none;background:transparent;font-size:1.1rem;cursor:pointer;transition:background .2s;display:flex;align-items:center;justify-content:center;color:var(--dark)}
.qty-btn:hover{background:rgba(244,121,154,.08)}
.qty-val{width:36px;text-align:center;font-weight:700;font-size:.9rem}

/* ACTIONS */
.action-row{display:flex;gap:10px;margin-bottom:20px}
.btn-cart{flex:1;background:var(--pink-strong);color:#fff;border:none;border-radius:100px;padding:15px 24px;font-family:var(--fb);font-size:.95rem;font-weight:700;cursor:pointer;transition:all .25s;box-shadow:0 8px 24px rgba(244,121,154,.3)}
.btn-cart:hover{background:var(--rose);transform:translateY(-2px);box-shadow:0 14px 36px rgba(244,121,154,.4)}
.btn-fav{width:50px;height:50px;border-radius:50%;border:1.5px solid rgba(13,9,13,.12);background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:1.2rem;transition:all .2s;flex-shrink:0}
.btn-fav:hover{border-color:var(--pink)}
.btn-fav .ico-heart{width:22px;height:22px;fill:none;stroke:var(--rose);stroke-width:1.8;stroke-linejoin:round;transition:fill var(--dur-2) var(--ease)}
.btn-fav.active .ico-heart{fill:var(--pink)}
.btn-fav.active{border-color:var(--pink);background:rgba(244,121,154,.08)}
.btn-wa{width:100%;min-height:48px;background:transparent;color:var(--ink);border:1.5px solid rgba(15,10,15,.2);border-radius:100px;padding:0 20px;font-family:var(--fb);font-size:1rem;font-weight:600;cursor:pointer;transition:border-color .2s,background .2s;display:flex;align-items:center;justify-content:center;gap:10px}
.btn-wa svg{color:#1faa53}
.btn-wa:hover{border-color:var(--ink);background:rgba(15,10,15,.03)}
[data-theme="dark"] .btn-wa{color:#f0e8ec;border-color:rgba(240,232,236,.25)}

/* DESCRIPTION */
.pdesc{font-size:.95rem;line-height:1.85;color:rgba(13,9,13,.6);margin-bottom:20px}
.pinfo-tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.ptag{background:rgba(244,121,154,.08);color:var(--rose);border-radius:100px;padding:4px 12px;font-size:.75rem;font-weight:600}

/* RELATED */
.related{max-width:1200px;margin:0 auto;padding:0 48px 80px}
.related h2{font-family:var(--fd);font-size:1.6rem;font-weight:700;margin-bottom:28px}
.related-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}
.pcard{background:#fff;border-radius:var(--r);overflow:hidden;border:1px solid rgba(244,121,154,.08);transition:all .3s;cursor:pointer}
.pcard:hover{transform:translateY(-6px);border-color:rgba(244,121,154,.25);box-shadow:0 16px 40px rgba(244,121,154,.1)}
.pcard-img{aspect-ratio:1;overflow:hidden;background:var(--cream);position:relative}
.pcard-img img{width:100%;height:100%;object-fit:cover;transition:transform .4s;position:absolute;inset:0}
.pcard:hover .pcard-img img{transform:scale(1.06)}
.pcard-ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:2.5rem}
.pcard-info{padding:14px 16px 18px}
.pcard-name{font-family:var(--fd);font-size:.95rem;font-weight:700;line-height:1.3;margin-bottom:5px}
.pcard-price{font-size:.88rem;font-weight:600;color:var(--rose)}

/* TOAST */
.toast{position:fixed;top:calc(var(--nav-h) + 12px);left:50%;transform:translate(-50%,-16px);opacity:0;padding:12px 20px;border-radius:var(--r-pill);font-size:var(--fs-sm);font-weight:500;z-index:999;transition:transform var(--dur-2) var(--ease),opacity var(--dur-2) var(--ease);pointer-events:none;color:#fff;box-shadow:var(--sh-2);max-width:calc(100vw - 32px)}
.toast.show{transform:translate(-50%,0);opacity:1}
.toast.ok{background:var(--ok)}
.toast.err{background:var(--err)}
.toast.info{background:#0f0a0f}

/* SKELETON */
.skel{background:linear-gradient(90deg,rgba(244,121,154,.08) 25%,rgba(244,121,154,.15) 50%,rgba(244,121,154,.08) 75%);background-size:200% 100%;animation:sk 1.4s infinite;border-radius:8px}
@keyframes sk{0%{background-position:200% 0}100%{background-position:-200% 0}}

@media(max-width:900px){
  .breadcrumb{padding:12px 16px}
  .page{grid-template-columns:minmax(0,1fr);gap:32px;padding:16px 16px 60px}
  .gallery{position:static}
  .related{padding:0 16px 60px}
  .related-grid{grid-template-columns:1fr 1fr;gap:14px}
}
@media(max-width:480px){
  .related-grid{grid-template-columns:1fr 1fr}
  .thumb{width:58px;height:58px}
}

.frete-box{margin-top:20px;border:1.5px solid rgba(229,37,100,.12);border-radius:14px;padding:16px}
.frete-box h4{font-size:.75rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:12px}
.frete-input-row{display:flex;gap:8px}
.frete-input{flex:1;padding:10px 14px;border:1.5px solid rgba(13,9,13,.12);border-radius:100px;font-family:var(--fb);font-size:.86rem;outline:none;transition:border-color .2s}
.frete-input:focus{border-color:var(--pink)}
.frete-calc-btn{background:var(--pink-strong);color:#fff;border:none;border-radius:100px;padding:10px 18px;font-family:var(--fb);font-size:.82rem;font-weight:600;cursor:pointer;white-space:nowrap;transition:background .2s}
.frete-calc-btn:hover{background:var(--rose)}
.frete-results{margin-top:12px}
.frete-option{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid rgba(229,37,100,.06);font-size:.83rem}
.frete-option:last-child{border:none}
.frete-option-name{font-weight:600}
.frete-option-info{font-size:.75rem;color:var(--muted);margin-top:2px}
.frete-option-price{font-weight:700;color:var(--rose)}
.frete-loading{text-align:center;padding:16px;color:var(--muted);font-size:.82rem}

/* Sticky CTA bar */
.sticky-cta{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid rgba(229,37,100,.12);padding:12px 20px;display:none;align-items:center;justify-content:space-between;gap:12px;z-index:200;box-shadow:0 -4px 20px rgba(0,0,0,.08)}
.sticky-cta-name{font-weight:700;font-size:.88rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:200px}
.sticky-cta-price{font-family:var(--fd);font-weight:700;color:var(--rose);font-size:1.1rem;white-space:nowrap}
.sticky-cta-btn{background:var(--pink-strong);color:#fff;border:none;border-radius:100px;padding:10px 20px;font-family:var(--fb);font-size:.85rem;font-weight:700;cursor:pointer;white-space:nowrap;flex-shrink:0;transition:background .2s}
.sticky-cta-btn:hover{background:var(--rose)}
@media(min-width:901px){.sticky-cta{display:none!important}}

/* ── LIGHTBOX ── */
#lightbox{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:9000;display:none;align-items:center;justify-content:center;cursor:zoom-out}
#lightbox img{max-width:95vw;max-height:90vh;object-fit:contain;border-radius:8px;user-select:none}
#lightboxClose{position:fixed;top:16px;right:16px;background:rgba(255,255,255,.15);border:none;color:#fff;width:40px;height:40px;border-radius:50%;font-size:1.1rem;cursor:pointer}
#lightboxPrev,#lightboxNext{position:fixed;top:50%;transform:translateY(-50%);background:rgba(255,255,255,.15);border:none;color:#fff;width:44px;height:44px;border-radius:50%;font-size:1.3rem;cursor:pointer}
#lightboxPrev{left:12px}#lightboxNext{right:12px}
#lightboxIdx{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);color:rgba(255,255,255,.6);font-size:.78rem}


/* ── GALLERY DOTS ── */
.gallery-dots{display:flex;justify-content:center;gap:6px;margin-top:8px}
.gallery-dot{width:6px;height:6px;border-radius:50%;background:rgba(229,37,100,.2);transition:all .2s;cursor:pointer;border:none;padding:0}
.gallery-dot.active{background:var(--pink);width:18px;border-radius:100px}


/* ── SHARE ── */
.share-row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.share-btn{display:flex;align-items:center;gap:6px;padding:8px 14px;border-radius:100px;border:1.5px solid rgba(229,37,100,.2);background:#fff;font-family:var(--fb);font-size:.78rem;font-weight:600;cursor:pointer;color:var(--dark);transition:all .2s}
.share-btn:hover{background:var(--pink-strong);color:#fff;border-color:var(--pink)}


/* ── ZOOM ── */
.gallery-main{overflow:hidden}
.gallery-main img{transition:transform .3s ease;transform-origin:var(--ox,50%) var(--oy,50%)}
.gallery-main:hover img{transform:scale(1.5)}
@media(max-width:768px){.gallery-main:hover img{transform:none}}


/* ── AVALIAÇÕES ── */
.reviews{max-width:1200px;margin:0 auto;padding:0 48px 60px}
.reviews-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;flex-wrap:wrap;gap:12px}
.reviews-title{font-family:var(--fd);font-size:1.4rem;font-weight:700}
.reviews-avg{display:flex;align-items:center;gap:10px}
.reviews-avg-num{font-family:var(--fd);font-size:2rem;font-weight:700;color:var(--dark)}
.reviews-avg-stars{color:#f59e0b;font-size:1.1rem}
.reviews-avg-count{font-size:.82rem;color:var(--muted)}
.review-card{background:#fff;border-radius:16px;padding:20px;margin-bottom:12px;border:1px solid rgba(229,37,100,.06)}
.review-card-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;gap:8px;flex-wrap:wrap}
.review-name{font-weight:700;font-size:.9rem}
.review-stars{color:#f59e0b;font-size:.85rem}
.review-date{font-size:.75rem;color:var(--muted)}
.review-text{font-size:.86rem;color:rgba(13,9,13,.65);line-height:1.6;margin-bottom:10px}
.review-photo{width:80px;height:80px;object-fit:cover;border-radius:10px;cursor:pointer}
.reviews-empty{text-align:center;padding:32px;color:var(--muted);font-size:.88rem}
@media(max-width:768px){.reviews{padding:0 16px 48px}}


/* ── ALERTA ESTOQUE ── */
.stock-alert{margin-top:12px}
.stock-alert-form{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.stock-alert-form input{flex:1;min-width:0;padding:10px 14px;border:1.5px solid rgba(229,37,100,.2);border-radius:100px;font-family:var(--fb);font-size:.84rem;outline:none}
.stock-alert-form button{background:var(--pink-strong);color:#fff;border:none;border-radius:100px;padding:10px 18px;font-family:var(--fb);font-size:.84rem;font-weight:600;cursor:pointer;white-space:nowrap}


/* ── CART DRAWER ── */
.cart-ov{position:fixed;inset:0;background:rgba(13,9,13,.4);z-index:800;opacity:0;pointer-events:none;transition:opacity .3s}
.cart-ov.open{opacity:1;pointer-events:all}
.cart-drw{position:fixed;right:0;top:0;bottom:0;width:min(380px,100vw);background:#fff;z-index:801;transform:translateX(100%);transition:transform .32s cubic-bezier(.25,.46,.45,.94);display:flex;flex-direction:column;box-shadow:-8px 0 32px rgba(13,9,13,.12)}
.cart-drw.open{transform:none}
.cart-drw-head{display:flex;align-items:center;justify-content:space-between;padding:20px;border-bottom:1px solid rgba(229,37,100,.08)}
.cart-drw-head h3{font-family:var(--fd);font-size:1.1rem}
.cart-drw-close{background:none;border:none;font-size:1.2rem;cursor:pointer;color:var(--muted)}
.cart-drw-items{flex:1;overflow-y:auto;padding:16px}
.cart-drw-item{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid rgba(229,37,100,.06)}
.cart-drw-item img{width:56px;height:56px;object-fit:cover;border-radius:10px;flex-shrink:0}
.cart-drw-item-name{font-size:.84rem;font-weight:600;margin-bottom:2px}
.cart-drw-item-var{font-size:.8rem;color:var(--muted);margin-bottom:2px}
.cart-drw-item-price{font-size:.8rem;color:var(--pink);font-weight:700}
.cart-drw-foot{padding:16px;border-top:1px solid rgba(229,37,100,.08)}
.cart-drw-total{display:flex;justify-content:space-between;font-weight:700;margin-bottom:12px;font-size:.95rem}
.cart-drw-checkout{display:block;width:100%;background:var(--pink-strong);color:#fff;border:none;border-radius:100px;padding:14px;font-family:var(--fb);font-size:.9rem;font-weight:700;cursor:pointer;text-align:center;text-decoration:none}
.cart-drw-checkout:hover{background:var(--rose)}
.cart-drw-empty{text-align:center;padding:40px 20px;color:var(--muted);font-size:.88rem}


/* AUTO-GENERATED dark mode text-color overrides */
[data-theme="dark"] .breadcrumb,
[data-theme="dark"] .breadcrumb a,
[data-theme="dark"] .cart-drw-close,
[data-theme="dark"] .cart-drw-empty,
[data-theme="dark"] .frete-box h4,
[data-theme="dark"] .frete-loading,
[data-theme="dark"] .frete-option-info,
[data-theme="dark"] .pdesc,
[data-theme="dark"] .pinfo-prazo,
[data-theme="dark"] .pinfo-price .old,
[data-theme="dark"] .review-date,
[data-theme="dark"] .review-text,
[data-theme="dark"] .reviews-avg-count,
[data-theme="dark"] .reviews-empty,
[data-theme="dark"] .var-section h3{color:rgba(240,232,236,.55)!important}

/* AUTO-GENERATED dark mode white-bg overrides */
[data-theme="dark"] .btn-fav:not(.active),
[data-theme="dark"] .cart-drw,
[data-theme="dark"] .pcard,
[data-theme="dark"] .review-card,

/* AUTO-GENERATED dark mode override for INLINE styles */

[data-theme="dark"] [style*="color:rgba(13,9,13,.5)"]{color:rgba(240,232,236,.55)!important}
[data-theme="dark"] [style*="color:rgba(13,9,13,.6)"]{color:rgba(240,232,236,.55)!important}
[data-theme="dark"] [style*="color:rgba(13,9,13,.35)"]{color:rgba(240,232,236,.55)!important}
[data-theme="dark"] [style*="color:rgba(13,9,13,.38)"]{color:rgba(240,232,236,.55)!important}

/* AUTO-GENERATED border visibility fix for dark mode */

[data-theme="dark"] .frete-input,
[data-theme="dark"] .qty-ctrl,
[data-theme="dark"] .var-opt{border-color:rgba(244,121,154,.25)!important}
</style>

<header class="site-nav" id="siteNav" data-page="loja">

<script>
// ── DARK MODE ─────────────────────────────────────────────────────
function applyTheme(theme){
  document.documentElement.setAttribute('data-theme',theme);
  const moonIcon=document.getElementById('themeIconMoon');
  const sunIcon=document.getElementById('themeIconSun');
  if(moonIcon&&sunIcon){
    moonIcon.style.display=theme==='dark'?'none':'block';
    sunIcon.style.display=theme==='dark'?'block':'none';
  }
}
function toggleTheme(){
  const current=document.documentElement.getAttribute('data-theme')||'light';
  const next=current==='dark'?'light':'dark';
  localStorage.setItem('cr_theme',next);
  applyTheme(next);
}
function initTheme(){
  const saved=localStorage.getItem('cr_theme');
  const prefersDark=window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches;
  applyTheme(saved||(prefersDark?'dark':'light'));
}
initTheme();

// ── FILES INDEX ───────────────────────────────────────────────────────
const fileIdx=new Map();
for(const f of FILES){
  const base=f.n.replace(/\.[^.]+$/,'');
  const prefix=base.includes('-')?base.substring(0,base.lastIndexOf('-')):base;
  if(!fileIdx.has(prefix))fileIdx.set(prefix,f.u);
}
function getUrls(name,limit=8){
  // Use fotos table if available
  if(window._prodFotos&&window._prodFotos.length) return window._prodFotos.slice(0,limit);
  if(!name)return[];
  const slug=name.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
  const parts=slug.split('-');
  const matches=FILES.filter(f=>{
    const n=f.n.toLowerCase();
    return parts.slice(0,3).every(p=>n.includes(p));
  });
  // deduplicate by prefix
  const seen=new Set(),result=[];
  for(const f of matches){
    const base=f.n.replace(/\.[^.]+$/,'');
    const pre=base.includes('-')?base.substring(0,base.lastIndexOf('-')):base;
    if(!seen.has(pre)){seen.add(pre);result.push(f.u);}
    if(result.length>=limit)break;
  }
  return result;
}
function getUrl(name){return getUrls(name,1)[0]||'';}

function getCart(){
  try{
    const raw=localStorage.getItem('cr_cart');
    if(!raw)return[];
    const p=JSON.parse(raw);
    if(Array.isArray(p))return p;
    if(p.exp&&Date.now()>p.exp){localStorage.removeItem('cr_cart');return[];}
    return p.data||[];
  }catch{return[];}
}
function saveCart(c){
  const payload={data:c,exp:Date.now()+7*24*60*60*1000};
  localStorage.setItem('cr_cart',JSON.stringify(payload));
  updateCartBadge();
}
function updateCartBadge(){
  let n=0;try{n=getCart().reduce((s,i)=>s+(i.qty||1),0);}catch(e){}
  document.getElementById('cartBadge').textContent=n||'';
  document.getElementById('cartBadge').style.display=n?'flex':'none';
}
updateCartBadge();

function addToCart(prod,varTxt,qty){
  const cart=getCart();
  const key=prod.id+'_'+(varTxt||'');
  const existing=cart.find(i=>i.key===key);
  if(existing)existing.qty=(existing.qty||1)+qty;
  else cart.push({
    key,id:prod.id,name:prod.name,
    price:prod.price,url:getUrl(prod.name),
    variacao:varTxt,qty
  });
  saveCart(cart);
  toast(`${prod.name} adicionado ao carrinho`,'ok');
}

function renderVars(){
  const sec=document.getElementById('varSection');
  if(!variacoes.length){sec.style.display='none';return;}
  sec.style.display='block';

  const sizes=[...new Set(variacoes.filter(v=>v.tamanho).map(v=>v.tamanho))];
  const colors=[...new Set(variacoes.filter(v=>v.cor).map(v=>v.cor))];

  let html='';
  if(sizes.length){
    html+=`<div class="var-group"><div class="var-label">Tamanho</div><div class="var-options" id="sizeOpts">`;
    sizes.forEach(s=>{
      const v=variacoes.find(x=>x.tamanho===s);
      const esg=v&&v.estoque===0;
      const vExtra=v&&v.preco_extra?`<span class="var-extra">+${fmt(v.preco_extra)}</span>`:'';
      html+=`<button class="var-opt${esg?' esgotado':''}" onclick="selSize('${s}',this)" ${esg?'disabled':''}>${s}${vExtra}</button>`;
    });
    html+='</div></div>';
  }
  if(colors.length){
    html+=`<div class="var-group"><div class="var-label">Cor</div><div class="var-options" id="colorOpts">`;
    colors.forEach(c=>{
      html+=`<button class="var-opt" onclick="selColor('${c}',this)">${c}</button>`;
    });
    html+='</div></div>';
  }
  sec.innerHTML='<h3>Variações</h3>'+html;
}

async function toggleFav(){
  try{
    const sb=window._sb||(window._sb=supabase.createClient(SB,KEY));
    const {data:{session}}=await sb.auth.getSession();
    if(!session){toast('Entre na sua conta para favoritar','info');return;}
    const tok=session.access_token;
    const uid=session.user.id;
    if(isFav){
      await fetch(`${SB}/rest/v1/favoritos?user_id=eq.${uid}&produto_id=eq.${id}`,{method:'DELETE',headers:{...HDR,Authorization:'Bearer '+tok}});
      isFav=false;toast('Removido dos favoritos','info');

      await fetch(`${SB}/rest/v1/favoritos`,{method:'POST',headers:{...HDR,Authorization:'Bearer '+tok,'Prefer':'return=minimal'},body:JSON.stringify({user_id:uid,produto_id:parseInt(id)})});
      isFav=true;toast('Adicionado aos favoritos','ok');
    }
    document.getElementById('btnFav').classList.toggle('active',isFav);
    document.getElementById('btnFav').setAttribute('aria-pressed',isFav?'true':'false');
  }catch{toast('Entre na sua conta para favoritar','info');}
}

    const r=await fetch(url,{headers:HDR});
    let prods=await r.json();
    // If no results with category filter or offset, try without
    if(!Array.isArray(prods)||!prods.length){
      const r2=await fetch(`${SB}/rest/v1/produtos?select=id,name,price,collections&ativo=eq.true&oculto=eq.false&id=neq.${id}&limit=20`,{headers:HDR});
      prods=await r2.json();
    }
    if(!Array.isArray(prods)||!prods.length){document.getElementById('related').style.display='none';return;}
    // Shuffle and pick 4
    prods=prods.sort(()=>Math.random()-.5).slice(0,4);
    // Fetch fotos for related products
    const relIds=prods.map(p=>p.id).join(',');
    let relFotos={};
    try{
      const rf=await fetch(`${SB}/rest/v1/fotos?produto_id=in.(${relIds})&select=produto_id,url,ordem&order=ordem`,{headers:HDR});
      const rfData=await rf.json();
      if(Array.isArray(rfData)) rfData.forEach(f=>{if(!relFotos[f.produto_id])relFotos[f.produto_id]=f.url;});
    }catch(e){}
    document.getElementById('related').style.display='block';
    document.getElementById('relatedGrid').innerHTML=prods.map(p=>{
      const purl=relFotos[p.id]||getUrl(p.name);
      return `<div class="pcard" onclick="location.href='produto.html?id=${p.id}'" style="cursor:pointer">
        <div class="pcard-img">
          ${purl?`<img src="${purl}" loading="lazy" onerror="this.style.display='none'">`:''}
          <div class="pcard-ph" ${purl?'style="display:none"':''}>🌸</div>
        </div>
        <div class="pcard-info">
          <div class="pcard-name">${p.name}</div>
          ${p.price?`<div class="pcard-price">${fmt(p.price)}</div>`:''}
        </div>
      </div>`;
    }).join('');
  }catch(e){console.error('related:',e);document.getElementById('related').style.display='none';}
}

async function calcFreteProd(){
  const cep=document.getElementById('freteCep')?.value.replace(/\D/g,'');
  if(!cep||cep.length<8){toast('CEP inválido','err');return;}
  if(!prod){toast('Produto não carregado','err');return;}

  const el=document.getElementById('freteResults');
  el.innerHTML='<div class="frete-loading">⏳ Calculando...</div>';

  const dims=getDimsProd(prod.collections||[]);

  try{
    const r=await fetch(ME_FN,{
      method:'POST',
      headers:{'Content-Type':'application/json',apikey:ME_SB_KEY,Authorization:'Bearer '+ME_SB_KEY},
      body:JSON.stringify({
        path:'/me/shipment/calculate',
        method:'POST',
        body:{
          from:{postal_code:'13385024'},
          to:{postal_code:cep},
          products:[{
            id:String(prod.id),
            width:dims.largura,
            height:dims.altura,
            length:dims.comprimento,
            weight:dims.peso,
            insurance_value:prod.price||50,
            quantity:qty||1
          }],
          services:'1,2,3,4,17,18',
          options:{receipt:false,own_hand:false}
        }
      })
    });
    const data=await r.json();
    if(!Array.isArray(data)){el.innerHTML='<div class="frete-loading">Erro ao calcular frete</div>';return;}
    const validas=data.filter(s=>!s.error&&s.price).sort((a,b)=>parseFloat(a.price)-parseFloat(b.price));
    if(!validas.length){el.innerHTML='<div class="frete-loading">Nenhuma opção disponível</div>';return;}
    el.innerHTML=validas.slice(0,5).map(s=>`
      <div class="frete-option">
        <div>
          <div class="frete-option-name">${s.company?.name||''} — ${s.name}</div>
          <div class="frete-option-info">Prazo: ${s.delivery_time} dias úteis</div>
        </div>
        <div class="frete-option-price">R$ ${parseFloat(s.price).toFixed(2).replace('.',',')}</div>
      </div>`).join('');
  }catch(e){
    el.innerHTML=`<div class="frete-loading">Erro: ${e.message.slice(0,60)}</div>`;
  }
}

function getDimsProd(collections){
  // Default dims per category — matches admin config
  const map={
    'Fantasias':{peso:.5,altura:30,largura:30,comprimento:30},
    'Almofadas':{peso:.6,altura:40,largura:40,comprimento:15},
    'Decoração':{peso:.4,altura:25,largura:25,comprimento:20},
    'Para bebês':{peso:.3,altura:20,largura:20,comprimento:15},
    'Educativo':{peso:.4,altura:25,largura:25,comprimento:20},
    'Bolsas & mochilas':{peso:.5,altura:35,largura:30,comprimento:15},
  };
  for(const cat of collections){
    if(map[cat])return map[cat];
  }
  return {peso:.5,altura:30,largura:30,comprimento:20};
}


// ── STICKY CTA ────────────────────────────────────────────────────────
function initStickyCta(){
  if(!prod)return;
  document.getElementById('stickyName').textContent=prod.name;
  document.getElementById('stickyPrice').textContent=prod.price?fmt(prod.preco_promocional||prod.price):'';
  const cta=document.getElementById('stickyCta');
  const actionRow=document.querySelector('.action-row');
  const observer=new IntersectionObserver(entries=>{
    entries.forEach(e=>{
      if(cta) cta.style.display=e.isIntersecting?'none':'flex';
    });
  },{threshold:.1});
  if(actionRow)observer.observe(actionRow);
}


function renderDesc(text){
  if(!text) return 'Produto feito com carinho sob encomenda.';
  // If multiline or has periods mid-text, convert to bullets
  const lines=text.split(/\n|(?<=\. )/).map(l=>l.trim()).filter(l=>l.length>10);
  if(lines.length>1){
    return '<ul style="padding-left:18px;line-height:2;color:rgba(13,9,13,.6);font-size:.95rem">'+
      lines.map(l=>`<li>${l}</li>`).join('')+'</ul>';
  }
  return `<p style="font-size:.95rem;line-height:1.85;color:rgba(13,9,13,.6)">${text}</p>`;
}

// ── LIGHTBOX ─────────────────────────────────────────────────────
let _lbIdx=0;
function abrirLightbox(idx){
  const urls=window._prodFotos||getUrls(prod?.name);
  if(!urls||!urls.length)return;
  _lbIdx=idx||0;
  const lb=document.getElementById('lightbox');
  const img=document.getElementById('lightboxImg');
  if(!lb||!img)return;
  img.src=urls[_lbIdx];
  document.getElementById('lightboxIdx').textContent=(_lbIdx+1)+' / '+urls.length;
  lb.style.display='flex';
  document.body.style.overflow='hidden';
}
function fecharLightbox(){
  const lb=document.getElementById('lightbox');
  if(lb)lb.style.display='none';
  document.body.style.overflow='';
}
function lightboxNav(dir){
  const urls=window._prodFotos||getUrls(prod?.name);
  if(!urls)return;
  _lbIdx=(_lbIdx+dir+urls.length)%urls.length;
  document.getElementById('lightboxImg').src=urls[_lbIdx];
  document.getElementById('lightboxIdx').textContent=(_lbIdx+1)+' / '+urls.length;
}
document.addEventListener('keydown',e=>{
  if(document.getElementById('lightbox')?.style.display==='flex'){
    if(e.key==='Escape')fecharLightbox();
    if(e.key==='ArrowLeft')lightboxNav(-1);
    if(e.key==='ArrowRight')lightboxNav(1);
  }
});

function updateSEO(p,imgUrl){
  const desc=`${p.name} — Chuchu Rosa. ${p.descricao?p.descricao+' ':''}Produção sob medida em 3 a 5 dias úteis.`;
  // Meta description
  let metaDesc=document.querySelector('meta[name="description"]');
  if(!metaDesc){metaDesc=document.createElement('meta');metaDesc.name='description';document.head.appendChild(metaDesc);}
  metaDesc.content=desc.slice(0,160);
  // OG tags
  const ogs={title:p.name+' — Chuchu Rosa',description:desc.slice(0,200),image:imgUrl||'',url:window.location.href,type:'product'};
  Object.entries(ogs).forEach(([k,v])=>{
    let tag=document.querySelector(`meta[property="og:${k}"]`);
    if(!tag){tag=document.createElement('meta');tag.setAttribute('property','og:'+k);document.head.appendChild(tag);}
    tag.content=v;
  });
}

// ── AVALIAÇÕES ────────────────────────────────────────────────────
async function loadReviews(){
  if(!id)return;
  try{
    // view sem e-mail (supabase/2026-09-27-lgpd.sql): avaliações do produto e as
    // avaliações gerais dos pedidos que o incluíram, numa consulta só
    const COLS='id,pedido_id,produto_id,cliente_nome,estrelas,comentario,foto_url,created_at';
    let reviews;
    const rv=await fetch(`${SB}/rest/v1/avaliacoes_publicas?or=(produto_id.eq.${id},produtos_do_pedido.cs.{${id}})&select=${COLS}&order=created_at.desc`,{headers:HDR});
    if(rv.status!==404){
      reviews=await rv.json();
      if(!Array.isArray(reviews))reviews=[];
    }else{
      // TODO remover depois que o SQL de LGPD rodar: leitura antiga, já sem e-mail
      const r=await fetch(`${SB}/rest/v1/avaliacoes?produto_id=eq.${id}&aprovada=eq.true&select=${COLS}&order=created_at.desc`,{headers:HDR});
      reviews=await r.json();
      if(!Array.isArray(reviews))reviews=[];
      const riPedidos=await fetch(`${SB}/rest/v1/itens_pedido?produto_id=eq.${id}&select=pedido_id`,{headers:HDR});
      const pedidoIds=await riPedidos.json();
      if(Array.isArray(pedidoIds)&&pedidoIds.length){
        const ids=pedidoIds.map(p=>p.pedido_id).join(',');
        const rg=await fetch(`${SB}/rest/v1/avaliacoes?pedido_id=in.(${ids})&aprovada=eq.true&select=${COLS}&order=created_at.desc`,{headers:HDR});
        const general=await rg.json();
        if(Array.isArray(general)) reviews=[...reviews,...general];
      }
    }

    // Deduplicate
    const seen=new Set();
    reviews=reviews.filter(r=>{if(seen.has(r.id))return false;seen.add(r.id);return true;});

    const section=document.getElementById('reviewsSection');
    const list=document.getElementById('reviewsList');
    const avg=document.getElementById('reviewsAvg');
    if(!reviews.length){section.style.display='none';return;}
    section.style.display='block';

    // Average
    const mean=(reviews.reduce((s,r)=>s+r.estrelas,0)/reviews.length).toFixed(1);
    avg.innerHTML=`<div class="reviews-avg-num">${mean}</div><div><div class="reviews-avg-stars">${'⭐'.repeat(Math.round(mean))}</div><div class="reviews-avg-count">${reviews.length} avaliação${reviews.length!==1?'ões':''}</div></div>`;

    // nome e comentário vêm do cliente: escapar sempre; foto só https
    const escH=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    list.innerHTML=reviews.map(r=>{
      const est=Math.min(5,Math.max(0,Math.round(Number(r.estrelas)||0)));
      const foto=r.foto_url&&/^https:\/\//i.test(r.foto_url)?escH(r.foto_url):'';
      return `
      <div class="review-card">
        <div class="review-card-head">
          <div>
            <div class="review-name">${escH(r.cliente_nome)||'Cliente'}</div>
            <div class="review-stars" aria-label="${est} de 5 estrelas">${'⭐'.repeat(est)}</div>
          </div>
          <div class="review-date">${new Date(r.created_at).toLocaleDateString('pt-BR')}</div>
        </div>
        ${r.comentario?`<div class="review-text">${escH(r.comentario)}</div>`:''}
        ${foto?`<a href="${foto}" target="_blank" rel="noopener"><img src="${foto}" class="review-photo" alt="Foto enviada por quem avaliou" loading="lazy"></a>`:''}
      </div>`;}).join('');
  }catch(e){console.log('reviews:',e);}
}

function openCartDrawer(){
  renderCartDrw();
  document.getElementById('cartDrw').classList.add('open');
  document.getElementById('cartOv').classList.add('open');
  document.body.style.overflow='hidden';
}
function closeCartDrawer(){
  document.getElementById('cartDrw').classList.remove('open');
  document.getElementById('cartOv').classList.remove('open');
  document.body.style.overflow='';
}
function renderCartDrw(){
  const items=document.getElementById('cartDrwItems');
  const foot=document.getElementById('cartDrwFoot');
  const cart=getCart();
  if(!cart.length){
    items.innerHTML='<div class="cart-drw-empty">Seu carrinho está vazio</div>';
    foot.style.display='none';return;
  }
  const total=cart.reduce((s,i)=>s+(i.price||0)*(i.qty||1),0);
  items.innerHTML=cart.map(i=>`
    <div class="cart-drw-item">
      ${(i.url||i.img)?`<img src="${i.url||i.img}" alt="">`:'<div style="width:56px;height:56px;background:rgba(229,37,100,.08);border-radius:10px;flex-shrink:0;display:flex;align-items:center;justify-content:center">🌸</div>'}
      <div style="flex:1;min-width:0">
        <div class="cart-drw-item-name">${i.name}</div>${i.variacao?`<div class="cart-drw-item-var">${i.variacao}</div>`:''}
        <div class="cart-drw-item-price">R$ ${((i.price||0)*(i.qty||1)).toFixed(2).replace('.',',')}</div>
        <div style="font-size:.74rem;color:rgba(13,9,13,.4)">Qtd: ${i.qty||1}</div>
      </div>
    </div>`).join('');
  document.getElementById('cartDrwTotal').textContent='R$ '+total.toFixed(2).replace('.',',');
  foot.style.display='block';
}
