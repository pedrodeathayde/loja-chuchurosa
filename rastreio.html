<style>
:root{--dark:var(--ink);--white:#fff}
[data-theme="dark"]{--cream:#15101a;--white:#1e1722;--dark:#f0e8ec;--ink:#f0e8ec;--muted:rgba(240,232,236,.66);--line:rgba(240,232,236,.1)}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:var(--fb);color:var(--dark);min-height:100vh;
  background:radial-gradient(circle at 15% 0%,rgba(229,37,100,.06),transparent 45%),var(--cream);
  transition:background-color .3s ease,color .3s ease;
}
main{display:flex;flex-direction:column;align-items:center;padding:var(--s7) var(--s4) var(--s8)}

.card{
  background:var(--white);border-radius:24px;padding:var(--s6) var(--s6) var(--s6);
  max-width:480px;width:100%;
  box-shadow:var(--sh-2);border:1px solid rgba(229,37,100,.07);
}
.hero-icon{
  width:56px;height:56px;margin:0 auto var(--s4);border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  background:rgba(229,37,100,.09);color:var(--rose);
}
.hero-icon svg{width:26px;height:26px}
h1{font-family:var(--fd);font-size:clamp(1.75rem,1.4rem + 1.2vw,2.125rem);font-weight:600;line-height:1.1;letter-spacing:-.015em;text-align:center;margin-bottom:var(--s2)}
.subtitle{font-size:var(--fs-body);line-height:1.55;color:var(--muted);text-align:center;margin-bottom:var(--s6)}

.input-wrap{margin-bottom:var(--s4)}
[data-theme="dark"] .field{background:rgba(240,232,236,.05);border-color:rgba(240,232,236,.14);color:#f0e8ec}
[data-theme="dark"] .field-label{color:#f0e8ec}
[data-theme="dark"] .field::placeholder{color:rgba(240,232,236,.45)}
.btn-track[aria-busy=true]{opacity:.7;pointer-events:none}
[hidden]{display:none!important}

.error{
  display:none;align-items:center;gap:10px;margin-top:var(--s4);padding:12px 16px;
  background:rgba(179,38,30,.07);border:1px solid rgba(179,38,30,.18);border-radius:var(--r-sm);
  color:var(--err);font-size:var(--fs-sm);font-weight:500;
}
.error svg{width:18px;height:18px;flex:none}
[data-theme="dark"] .error{color:#f3a19b;background:rgba(243,161,155,.1);border-color:rgba(243,161,155,.2)}

#result{display:none;margin-top:var(--s6);padding-top:var(--s5);border-top:1px dashed rgba(229,37,100,.18)}
.order-id{text-align:center;margin-bottom:var(--s5)}

.timeline{position:relative;padding-left:4px}
.track-status{display:flex;align-items:flex-start;gap:14px;padding:10px 0;position:relative}
.track-status:not(:last-child)::before{
  content:'';position:absolute;left:13px;top:36px;bottom:-6px;width:2px;
  background:rgba(229,37,100,.14);
}
.track-status.done:not(:last-child)::before{background:var(--pink)}
.track-dot{
  width:28px;height:28px;border-radius:50%;flex-shrink:0;z-index:1;
  display:flex;align-items:center;justify-content:center;
  background:var(--white);border:2px solid rgba(229,37,100,.2);color:#fff;
}
.track-dot svg{width:14px;height:14px}
.track-dot.done{background:var(--pink-strong);border-color:transparent}
.track-dot.current{box-shadow:0 0 0 5px rgba(229,37,100,.16)}
.track-info{flex:1;padding-top:4px}
.track-label{font-size:var(--fs-body);font-weight:600;line-height:1.3}
.track-status:not(.done) .track-label{color:var(--muted);font-weight:500}
.track-sub{font-size:var(--fs-sm);color:var(--muted);margin-top:2px}

.track-link{margin-top:var(--s5)}
.track-link svg{width:16px;height:16px}
[data-theme="dark"] .btn-secondary{color:#f0e8ec;border-color:rgba(240,232,236,.25)}

@media(max-width:480px){
  main{padding:var(--s6) var(--s4) var(--s7)}
  .card{padding:var(--s6) var(--s5)}
}
</style>
</head>
<body>

    <a href="sobre.html" data-nav="sobre">Sobre</a>

  </div>

    <a href="minha-conta.html" data-nav="conta"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 21v-1.5a4.5 4.5 0 0 0-4.5-4.5h-7A4.5 4.5 0 0 0 4 19.5V21"/><circle cx="12" cy="7.5" r="4"/></svg>Minha conta</a>
    <button type="button" onclick="toggleTheme()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18Z" fill="currentColor"/></svg>Alternar tema claro/escuro</button>
  </div>
</div>

<main id="conteudo">
<div class="card">
  <div class="hero-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 8 12 3 3 8v8l9 5 9-5Z"/><path d="M3 8l9 5 9-5M12 13v8"/></svg></div>
  <h1>Rastrear pedido</h1>
  <p class="subtitle">Acompanhe o status da sua encomenda em tempo real</p>

  <div class="input-wrap">
    <label class="field-label" for="trackInput">Código ou número do pedido</label>
    <input class="field" id="trackInput" type="text" placeholder="Ex: BR123456789BR ou #42" oninput="syncEmailField()" onkeydown="if(event.key==='Enter')rastrear()">
  </div>
  <div class="input-wrap" id="emailWrap" hidden>
    <label class="field-label" for="trackEmail">E-mail usado na compra</label>
    <input class="field" id="trackEmail" type="email" autocomplete="email" placeholder="voce@email.com" onkeydown="if(event.key==='Enter')rastrear()">
  </div>
  <button class="btn btn-primary btn-block btn-track" id="btnTrack" type="button" onclick="rastrear()"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><span> Rastrear pedido</span></button>

  <div class="error" id="trackError" role="alert">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7.5v5M12 16h.01"/></svg><span id="trackErrorMsg">Pedido não encontrado. Confira o código e tente de novo.</span>
  </div>

  <div id="result" aria-live="polite">
    <div class="order-id eyebrow" id="orderIdLabel"></div>
    <div class="timeline" id="trackSteps"></div>
    <a id="trackExternal" href="#" target="_blank" rel="noopener" class="btn btn-secondary btn-block track-link" style="display:none">Ver no Melhor Rastreio <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg></a>
  </div>
</div>

<script>
// ── DARK MODE ─────────────────────────────────────────────────────
function applyTheme(theme){
  document.documentElement.setAttribute('data-theme',theme);
  const moonIcon=document.getElementById('themeIconMoon');
  const sunIcon=document.getElementById('themeIconSun');
  if(moonIcon&&sunIcon){
    moonIcon.style.display=theme==='dark'?'none':'block';
    sunIcon.style.display=theme==='dark'?'block':'none';
  }
}
function toggleTheme(){
  const current=document.documentElement.getAttribute('data-theme')||'light';
  const next=current==='dark'?'light':'dark';
  localStorage.setItem('cr_theme',next);
  applyTheme(next);
}
function initTheme(){
  const saved=localStorage.getItem('cr_theme');
  const prefersDark=window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches;
  applyTheme(saved||(prefersDark?'dark':'light'));
}
initTheme();


const SB='https://oznpfqsgurztffwfyfec.supabase.co';
const KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im96bnBmcXNndXJ6dGZmd2Z5ZmVjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAxMjAyNjEsImV4cCI6MjA5NTY5NjI2MX0.wO7vQ3cDy9bRX6mifvgp4B_cNjVhY_YLq4qkLvwigQA';
const HDR={apikey:KEY,Authorization:'Bearer '+KEY,Accept:'application/json'};

const CHECK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>';
const STATUS_STEPS=[
  {key:'pendente',label:'Pedido recebido'},
  {key:'confirmado',label:'Confirmado'},
  {key:'em_producao',label:'Em produção'},
  {key:'pronto',label:'Pronto para envio'},
  {key:'enviado',label:'Enviado'},
  {key:'entregue',label:'Entregue'},
];

async function rastrear(){
  const val=document.getElementById('trackInput').value.trim();
  if(!val){document.getElementById('trackInput').focus();return;}
  const btn=document.getElementById('btnTrack');
  document.getElementById('trackError').style.display='none';
  document.getElementById('result').style.display='none';
  btn.setAttribute('aria-busy','true');btn.lastChild.textContent=' Buscando…';
  try{ await buscarPedido(val); }
  catch(e){ showTrackError('Não foi possível consultar agora. Verifique sua conexão e tente de novo.'); }
  finally{ btn.removeAttribute('aria-busy');btn.lastChild.textContent=' Rastrear pedido'; }
}
function showTrackError(msg){
  document.getElementById('trackErrorMsg').textContent=msg;
  document.getElementById('trackError').style.display='flex';
}
// chamada RPC; missing=true quando a função ainda não existe no banco
async function rpc(name,args){
  const r=await fetch(`${SB}/rest/v1/rpc/${name}`,{method:'POST',headers:{...HDR,'Content-Type':'application/json'},body:JSON.stringify(args)});
  let data=null;try{data=await r.json();}catch(e){}
  return {ok:r.ok,data,missing:r.status===404&&(!data||data.code==='PGRST202')};
}
const isNumeroPedido=v=>/^#?\d{1,9}$/.test(v.trim());
function syncEmailField(){
  const show=isNumeroPedido(document.getElementById('trackInput').value);
  document.getElementById('emailWrap').hidden=!show;
}

async function buscarPedido(val){
  const email=document.getElementById('trackEmail').value.trim();
  if(isNumeroPedido(val)&&!email){
    document.getElementById('emailWrap').hidden=false;
    document.getElementById('trackEmail').focus();
    showTrackError('Para buscar pelo número do pedido, informe também o e-mail usado na compra.');
    return;
  }

  let pedido=null;
  // rastreio sem dados pessoais (supabase/2026-09-27-lgpd.sql)
  const res=await rpc('rastrear_pedido_publico',{p_codigo:val,p_email:email||null});
  if(!res.missing){
    if(!res.ok)throw new Error('rpc');
    pedido=Array.isArray(res.data)&&res.data[0]?res.data[0]:null;
  }else{
    // TODO remover depois que o SQL de LGPD rodar: função antiga
    pedido=await buscarPedidoLegado(val);
  }

  if(!pedido){showTrackError(isNumeroPedido(val)?'Não encontramos um pedido com esse número e e-mail. Confira os dados e tente de novo.':'Pedido não encontrado. Confira o código e tente de novo.');return;}
  mostrarPedido(pedido);
}

async function buscarPedidoLegado(val){
  let pedido=null;
  const r1=await fetch(SB+'/rest/v1/rpc/rastrear_pedido',{
    method:'POST',headers:{...HDR,'Content-Type':'application/json'},
    body:JSON.stringify({p_tracking_code:val,p_id:null})
  });
  const d1=await r1.json();
  if(Array.isArray(d1)&&d1[0])pedido=d1[0];

  if(!pedido&&/^#?\d+$/.test(val)){
    const id=parseInt(val.replace('#',''));
    const r2=await fetch(SB+'/rest/v1/rpc/rastrear_pedido',{
      method:'POST',headers:{...HDR,'Content-Type':'application/json'},
      body:JSON.stringify({p_id:id,p_tracking_code:null})
    });
    const d2=await r2.json();
    if(Array.isArray(d2)&&d2[0])pedido=d2[0];
  }
  return pedido;
}

function mostrarPedido(pedido){
  const currentIdx=STATUS_STEPS.findIndex(s=>s.key===pedido.status);
  const steps=document.getElementById('trackSteps');
  steps.innerHTML=STATUS_STEPS.map((s,i)=>{
    const isDone=i<=currentIdx;
    const isCurrent=i===currentIdx;
    return `
    <div class="track-status ${isDone?'done':''}">
      <div class="track-dot ${isDone?'done':''} ${isCurrent?'current':''}">${isDone?CHECK:''}</div>
      <div class="track-info">
        <div class="track-label" style="opacity:${isDone?1:.4}">${s.label}</div>
        ${isCurrent&&pedido.updated_at?`<div class="track-sub">${new Date(pedido.updated_at).toLocaleDateString('pt-BR')}</div>`:''}
      </div>
    </div>`;
  }).join('');

  document.getElementById('orderIdLabel').textContent = pedido.id ? `Pedido #${pedido.id}` : '';

  const extLink=document.getElementById('trackExternal');
  if(pedido.tracking_code){extLink.href='https://www.melhorrastreio.com.br/rastreio/'+pedido.tracking_code;extLink.style.display='flex';}
  else extLink.style.display='none';

  document.getElementById('result').style.display='block';
}
</script>
<script src="js/site.js" defer></script>
</body>
