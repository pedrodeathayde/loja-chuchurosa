<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rastrear Pedido — Chuchu Rosa</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--pink:#e52564;--pink2:#f04d7f;--rose:#c41d55;--dark:#0d090d;--cream:#f8f0f6;--white:#fff;--fd:'Playfair Display',serif;--fb:'Outfit',sans-serif}
[data-theme="dark"]{--cream:#15101a;--white:#1e1722;--dark:#f0e8ec}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:var(--fb);color:var(--dark);min-height:100vh;
  background:radial-gradient(circle at 15% 0%,rgba(229,37,100,.07),transparent 45%),
             radial-gradient(circle at 100% 30%,rgba(244,121,154,.06),transparent 40%),
             var(--cream);
  display:flex;flex-direction:column;align-items:center;
  padding:32px 16px 60px;
  transition:background-color .3s ease,color .3s ease;
}

/* ── TOP BAR ── */
.topbar{width:100%;max-width:520px;display:flex;align-items:center;justify-content:space-between;margin-bottom:28px}
.back-link{display:flex;align-items:center;gap:6px;font-size:.82rem;color:rgba(13,9,13,.45);text-decoration:none;transition:color .2s}
.back-link:hover{color:var(--pink)}
[data-theme="dark"] .back-link{color:rgba(240,232,236,.5)}
.theme-btn{background:var(--white);border:1.5px solid rgba(229,37,100,.12);width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;color:rgba(13,9,13,.5);transition:all .2s;box-shadow:0 2px 8px rgba(13,9,13,.04)}
.theme-btn:hover{border-color:var(--pink);color:var(--pink)}
[data-theme="dark"] .theme-btn{color:rgba(240,232,236,.6)}

/* ── LOGO ── */
.logo-wrap{display:flex;justify-content:center;margin-bottom:28px}
#navLogo{height:54px}
#navLogo img{height:100%;width:auto;display:block;filter:drop-shadow(0 4px 16px rgba(229,37,100,.18))}

/* ── HERO CARD ── */
.card{
  background:var(--white);border-radius:28px;padding:36px 32px;
  max-width:480px;width:100%;
  box-shadow:0 24px 64px rgba(229,37,100,.1),0 2px 8px rgba(13,9,13,.04);
  border:1px solid rgba(229,37,100,.06);
  transition:background-color .3s ease,border-color .3s ease;
}
.hero-icon{font-size:2.6rem;text-align:center;margin-bottom:6px;animation:float 3s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
h1{font-family:var(--fd);font-size:1.5rem;font-weight:900;text-align:center;margin-bottom:6px;letter-spacing:-.01em}
.subtitle{font-size:.85rem;color:rgba(13,9,13,.5);text-align:center;margin-bottom:28px;line-height:1.5}
[data-theme="dark"] .subtitle{color:rgba(240,232,236,.55)}

/* ── INPUT ── */
.input-wrap{display:flex;flex-direction:column;gap:10px;margin-bottom:8px}
.field-label{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:rgba(13,9,13,.4);margin-bottom:2px}
[data-theme="dark"] .field-label{color:rgba(240,232,236,.4)}
input{
  width:100%;padding:14px 18px;border:1.5px solid rgba(229,37,100,.15);
  border-radius:14px;font-family:var(--fb);font-size:.95rem;outline:none;
  background:var(--cream);color:var(--dark);transition:all .2s;
}
input:focus{border-color:var(--pink);background:var(--white);box-shadow:0 0 0 4px rgba(229,37,100,.08)}
input::placeholder{color:rgba(13,9,13,.3)}
[data-theme="dark"] input::placeholder{color:rgba(240,232,236,.3)}
.btn-track{
  background:linear-gradient(135deg,var(--pink),var(--pink2));color:#fff;border:none;
  border-radius:14px;padding:15px;font-family:var(--fb);font-size:.92rem;font-weight:700;
  cursor:pointer;width:100%;margin-top:14px;transition:all .2s;
  box-shadow:0 8px 24px rgba(229,37,100,.28);
}
.btn-track:hover{transform:translateY(-1px);box-shadow:0 12px 28px rgba(229,37,100,.35)}
.btn-track:active{transform:translateY(0)}

.error{
  display:none;align-items:center;gap:10px;margin-top:16px;padding:12px 16px;
  background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.15);border-radius:12px;
  color:#dc2626;font-size:.84rem;font-weight:500;
}
[data-theme="dark"] .error{background:rgba(239,68,68,.12);color:#f87171}

/* ── RESULT / TIMELINE ── */
#result{display:none;margin-top:28px;padding-top:24px;border-top:1px dashed rgba(229,37,100,.15)}
.order-id{text-align:center;font-size:.78rem;color:rgba(13,9,13,.4);margin-bottom:20px;font-weight:600;letter-spacing:.02em}
[data-theme="dark"] .order-id{color:rgba(240,232,236,.45)}

.timeline{position:relative;padding-left:6px}
.track-status{display:flex;align-items:flex-start;gap:14px;padding:10px 0;position:relative}
.track-status:not(:last-child)::before{
  content:'';position:absolute;left:13px;top:34px;bottom:-4px;width:2px;
  background:rgba(229,37,100,.12);
}
.track-status.done:not(:last-child)::before{background:linear-gradient(180deg,var(--pink),rgba(229,37,100,.15))}
.track-dot{
  width:28px;height:28px;border-radius:50%;background:var(--cream);
  border:2px solid rgba(229,37,100,.18);
  display:flex;align-items:center;justify-content:center;font-size:.85rem;
  flex-shrink:0;z-index:1;transition:all .3s;
}
.track-dot.done{background:linear-gradient(135deg,var(--pink),var(--pink2));border-color:transparent;box-shadow:0 4px 12px rgba(229,37,100,.3)}
.track-dot.current{animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 4px 12px rgba(229,37,100,.3)}50%{box-shadow:0 4px 20px rgba(229,37,100,.5)}}
.track-info{flex:1;padding-top:3px}
.track-label{font-size:.88rem;font-weight:700;transition:opacity .3s}
.track-sub{font-size:.74rem;color:rgba(13,9,13,.4);margin-top:2px}
[data-theme="dark"] .track-sub{color:rgba(240,232,236,.45)}

.track-link{
  display:flex;align-items:center;justify-content:center;gap:8px;margin-top:22px;
  background:rgba(229,37,100,.07);border:1px solid rgba(229,37,100,.12);
  border-radius:14px;padding:13px 16px;text-decoration:none;color:var(--pink);
  font-size:.85rem;font-weight:700;transition:all .2s;
}
.track-link:hover{background:rgba(229,37,100,.12);transform:translateY(-1px)}
[data-theme="dark"] .track-link{background:rgba(244,121,154,.1);border-color:rgba(244,121,154,.18)}

.footer-note{margin-top:24px;text-align:center;font-size:.76rem;color:rgba(13,9,13,.35)}
[data-theme="dark"] .footer-note{color:rgba(240,232,236,.35)}

@media(max-width:480px){
  .card{padding:28px 22px;border-radius:22px}
  h1{font-size:1.3rem}
}
</style>
</head>
<body>

<div class="topbar">
  <a href="loja.html" class="back-link">← Voltar à loja</a>
  <button class="theme-btn" onclick="toggleTheme()" title="Alternar tema">
    <svg id="themeIconMoon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    <svg id="themeIconSun" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
  </button>
</div>

<div class="logo-wrap">
  <a href="index.html" id="navLogo"></a>
</div>

<div class="card">
  <div class="hero-icon">📦</div>
  <h1>Rastrear pedido</h1>
  <p class="subtitle">Acompanhe o status da sua encomenda em tempo real</p>

  <div class="input-wrap">
    <label class="field-label" for="trackInput">Código ou número do pedido</label>
    <input id="trackInput" type="text" placeholder="Ex: BR123456789BR ou #42" onkeydown="if(event.key==='Enter')rastrear()">
  </div>
  <button class="btn-track" onclick="rastrear()">🔍 Rastrear pedido</button>

  <div class="error" id="trackError">
    <span>😕</span><span>Pedido não encontrado. Confira o código e tente de novo.</span>
  </div>

  <div id="result">
    <div class="order-id" id="orderIdLabel"></div>
    <div class="timeline" id="trackSteps"></div>
    <a id="trackExternal" href="#" target="_blank" class="track-link" style="display:none">🔍 Ver no Melhor Rastreio →</a>
  </div>
</div>

<p class="footer-note">🌸 Chuchu Rosa — feito à mão, com carinho</p>

<script>
// ── DARK MODE ─────────────────────────────────────────────────────
function applyTheme(theme){
  document.documentElement.setAttribute('data-theme',theme);
  const moonIcon=document.getElementById('themeIconMoon');
  const sunIcon=document.getElementById('themeIconSun');
  if(moonIcon&&sunIcon){
    moonIcon.style.display=theme==='dark'?'none':'block';
    sunIcon.style.display=theme==='dark'?'block':'none';
  }
}
function toggleTheme(){
  const current=document.documentElement.getAttribute('data-theme')||'light';
  const next=current==='dark'?'light':'dark';
  localStorage.setItem('cr_theme',next);
  applyTheme(next);
}
function initTheme(){
  const saved=localStorage.getItem('cr_theme');
  const prefersDark=window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches;
  applyTheme(saved||(prefersDark?'dark':'light'));
}
initTheme();

function mkLogo(el,h){
  if(!el)return;
  const img=document.createElement('img');
  img.style.height=h+'px';img.style.width='auto';img.style.display='block';
  img.src=LOGO_URI;
  el.appendChild(img);
}
mkLogo(document.getElementById('navLogo'),46);

const SB='https://oznpfqsgurztffwfyfec.supabase.co';
const KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im96bnBmcXNndXJ6dGZmd2Z5ZmVjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAxMjAyNjEsImV4cCI6MjA5NTY5NjI2MX0.wO7vQ3cDy9bRX6mifvgp4B_cNjVhY_YLq4qkLvwigQA';
const HDR={apikey:KEY,Authorization:'Bearer '+KEY,Accept:'application/json'};

const STATUS_STEPS=[
  {key:'pendente',label:'Pedido recebido',icon:'📋'},
  {key:'confirmado',label:'Confirmado',icon:'✅'},
  {key:'em_producao',label:'Em produção',icon:'🔧'},
  {key:'pronto',label:'Pronto para envio',icon:'📦'},
  {key:'enviado',label:'Enviado',icon:'🚚'},
  {key:'entregue',label:'Entregue',icon:'🎉'},
];

async function rastrear(){
  const val=document.getElementById('trackInput').value.trim();
  if(!val)return;
  document.getElementById('trackError').style.display='none';
  document.getElementById('result').style.display='none';

  let pedido=null;
  const r1=await fetch(SB+'/rest/v1/rpc/rastrear_pedido',{
    method:'POST',headers:{...HDR,'Content-Type':'application/json'},
    body:JSON.stringify({p_tracking_code:val,p_id:null})
  });
  const d1=await r1.json();
  if(Array.isArray(d1)&&d1[0])pedido=d1[0];

  if(!pedido&&/^#?\d+$/.test(val)){
    const id=parseInt(val.replace('#',''));
    const r2=await fetch(SB+'/rest/v1/rpc/rastrear_pedido',{
      method:'POST',headers:{...HDR,'Content-Type':'application/json'},
      body:JSON.stringify({p_id:id,p_tracking_code:null})
    });
    const d2=await r2.json();
    if(Array.isArray(d2)&&d2[0])pedido=d2[0];
  }

  if(!pedido){document.getElementById('trackError').style.display='flex';return;}

  const currentIdx=STATUS_STEPS.findIndex(s=>s.key===pedido.status);
  const steps=document.getElementById('trackSteps');
  steps.innerHTML=STATUS_STEPS.map((s,i)=>{
    const isDone=i<=currentIdx;
    const isCurrent=i===currentIdx;
    return `
    <div class="track-status ${isDone?'done':''}">
      <div class="track-dot ${isDone?'done':''} ${isCurrent?'current':''}">${isDone?s.icon:''}</div>
      <div class="track-info">
        <div class="track-label" style="opacity:${isDone?1:.4}">${s.label}</div>
        ${isCurrent&&pedido.updated_at?`<div class="track-sub">${new Date(pedido.updated_at).toLocaleDateString('pt-BR')}</div>`:''}
      </div>
    </div>`;
  }).join('');

  document.getElementById('orderIdLabel').textContent = pedido.id ? `Pedido #${pedido.id}` : '';

  const extLink=document.getElementById('trackExternal');
  if(pedido.tracking_url){extLink.href=pedido.tracking_url;extLink.style.display='flex';}
  else if(pedido.tracking_code){extLink.href='https://www.melhorrastreio.com.br/rastreio/'+pedido.tracking_code;extLink.style.display='flex';}
  else extLink.style.display='none';

  document.getElementById('result').style.display='block';
}
</script>
